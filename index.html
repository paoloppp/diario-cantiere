<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diario">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#4f6bff">
<title>Diario Cantiere</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: diario tecnico da campo — lista cantieri, giornate, report compilato.
   Palette steel/slate con accento ambra "registrazione"; neutri a bias blu. */
:root{
  --bg:#eef1fb; --surface:#ffffff; --surface-2:#f3f6ff; --line:#dde3f3;
  --ink:#141b2e; --muted:#5a6684; --faint:#8b95b4;
  --accent:#3b5bfd; --accent-ink:#ffffff; --accent-soft:#e6ecff;
  --violet:#8a5cff; --violet-soft:#efeaff;
  --amber:#ff9d1c; --amber-soft:#fff1d9; --amber-ink:#b46a00;
  --pink:#ff5c86; --pink-soft:#ffe3ec;
  --rec:#ff4757; --rec-soft:#ffe1e4;
  --ok:#14b57e; --ok-soft:#d9f6ec;
  --grad:linear-gradient(135deg,#3b5bfd 0%,#8a5cff 52%,#ff5c86 100%);
  --grad-bar:linear-gradient(90deg,#3b5bfd,#8a5cff 70%,#b15cff);
  --radius:16px; --radius-sm:11px;
  --shadow:0 1px 2px rgba(20,30,70,.06),0 8px 26px rgba(40,50,120,.09);
  --shadow-col:0 8px 22px rgba(59,91,253,.28);
  --fdisplay:'Space Grotesk',system-ui,sans-serif; --fbody:'Inter',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1020; --surface:#161c33; --surface-2:#11162a; --line:#2a3250;
  --ink:#e9edfb; --muted:#9aa5cb; --faint:#6b76a0;
  --accent:#6f8bff; --accent-ink:#0a0e1c; --accent-soft:#1f2850;
  --violet:#a98bff; --violet-soft:#241d44;
  --amber:#ffb34d; --amber-soft:#3a2a12; --amber-ink:#ffb34d;
  --pink:#ff7fa0; --pink-soft:#3a1d29;
  --rec:#ff6b78; --rec-soft:#3a1a20;
  --ok:#3bd89c; --ok-soft:#10352a;
  --grad:linear-gradient(135deg,#3b5bfd 0%,#8a5cff 52%,#ff5c86 100%);
  --grad-bar:linear-gradient(90deg,#4f6bff,#9a6cff 70%,#c06cff);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
  --shadow-col:0 8px 22px rgba(59,91,253,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c1020; --surface:#161c33; --surface-2:#11162a; --line:#2a3250;
  --ink:#e9edfb; --muted:#9aa5cb; --faint:#6b76a0;
  --accent:#6f8bff; --accent-ink:#0a0e1c; --accent-soft:#1f2850;
  --violet:#a98bff; --violet-soft:#241d44;
  --amber:#ffb34d; --amber-soft:#3a2a12; --amber-ink:#ffb34d;
  --pink:#ff7fa0; --pink-soft:#3a1d29;
  --rec:#ff6b78; --rec-soft:#3a1a20;
  --ok:#3bd89c; --ok-soft:#10352a;
  --grad:linear-gradient(135deg,#3b5bfd 0%,#8a5cff 52%,#ff5c86 100%);
  --grad-bar:linear-gradient(90deg,#4f6bff,#9a6cff 70%,#c06cff);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
  --shadow-col:0 8px 22px rgba(59,91,253,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fbody);margin:0;line-height:1.5;
  -webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--fdisplay);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font-family:inherit;font-size:1rem;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink)}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--grad-bar);
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px;color:#fff}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  background:#4f6bff;z-index:11}
.bar .title{font-family:var(--fdisplay);font-weight:700;font-size:1.08rem;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.bar .home{background:rgba(255,255,255,.18);border:none;color:#fff;padding:7px 9px;border-radius:999px;display:flex;align-items:center;flex:none;cursor:pointer}
.acmi-logo{display:flex;justify-content:center;background:#fff;border-radius:var(--radius);padding:12px 16px;margin:12px 0 12px}
.acmi-logo img{display:block;max-width:220px;width:60%;height:auto}
.bar .back{background:rgba(255,255,255,.18);border:none;color:#fff;font-weight:600;padding:7px 12px;border-radius:999px;display:flex;align-items:center;gap:4px}
.chip-cap{font-size:.66rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
  color:#fff;background:rgba(255,255,255,.2);border-radius:999px;padding:4px 10px;white-space:nowrap}
.chip-cap.sync{background:rgba(255,255,255,.95);color:#1f8f63}

.wrap{max-width:860px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 120px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:var(--radius-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;
  padding:11px 15px;min-height:44px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--grad-bar);border-color:transparent;color:#fff;box-shadow:var(--shadow-col)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent)}
.btn.danger{color:var(--rec);border-color:transparent;background:none}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:7px 11px;font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card.pad{padding:16px}
.site-card{position:relative;display:flex;flex-direction:column;gap:5px;width:100%;text-align:left;margin-bottom:13px;
  border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:16px 16px 16px 20px;
  box-shadow:var(--shadow);overflow:hidden;transition:transform .12s,box-shadow .12s}
.site-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--grad)}
.site-card:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(40,50,120,.16)}
.site-card .cust{font-family:var(--fdisplay);font-weight:700;font-size:1.16rem;letter-spacing:-.01em}
.site-card .mac{color:var(--muted);font-size:.9rem}
.site-card .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.76rem;margin-top:8px}
.site-card .meta span{background:var(--surface-2);border-radius:999px;padding:4px 10px;color:var(--muted);font-weight:500}
.site-card .meta b{color:var(--accent);font-weight:700}

/* scorrimento sui cantieri: azioni rapide */
.swipe{position:relative;margin-bottom:13px}
.swipe .site-card{margin-bottom:0;z-index:1;touch-action:pan-y;-webkit-user-select:none;user-select:none;
  transition:transform .22s ease,box-shadow .12s}
.swipe.dragging .site-card{transition:none}
.swipe-acts{position:absolute;top:1px;bottom:1px;right:1px;display:flex;border-radius:var(--radius);overflow:hidden;z-index:0}
.swipe-acts button{width:68px;border:none;color:#fff;font-size:.72rem;font-weight:700;padding:0 4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:0}
.swipe-acts svg{width:20px;height:20px}
.swipe-acts .sa-edit{background:#3b5bfd}
.swipe-acts .sa-dup{background:#8a5cff}
.swipe-acts .sa-word{background:#e08600}
.swipe-acts .sa-del{background:#ff4757}
.swipe-hint{font-size:.78rem;color:var(--faint);text-align:center;margin:-6px 0 12px}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--grad);border-radius:var(--radius);
  padding:22px;margin:4px 0 20px;color:#fff;box-shadow:0 12px 30px rgba(90,70,220,.3)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;
  background:rgba(255,255,255,.12)}
.hero-eye{text-transform:uppercase;letter-spacing:.1em;font-size:.68rem;font-weight:700;opacity:.9}
.hero h2{font-size:1.65rem;margin:4px 0 2px;color:#fff}
.hero p{margin:0;opacity:.92;font-size:.9rem}
.btn-hero{position:relative;z-index:1;margin-top:16px;width:100%;border:none;border-radius:var(--radius-sm);
  background:#fff;color:var(--accent);font-weight:700;font-size:1rem;padding:14px;min-height:48px;
  display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.btn-hero:hover{filter:brightness(.98)}
.btn-hero.btn-word{margin-top:10px;background:rgba(255,255,255,.18);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.45)}
.toast.busy{opacity:1}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:.7rem;font-weight:700;color:var(--accent)}
.sec-head{display:flex;align-items:center;gap:10px;margin:22px 2px 12px}
.sec-head h2{font-size:1.15rem;flex:1}

/* day card */
.day{margin-bottom:12px}
.day .d-top{display:flex;align-items:baseline;gap:10px;padding:14px 15px 0}
.day .d-date{font-family:var(--fdisplay);font-weight:700;font-size:1.02rem}
.day .d-kind{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);border:none}
.day .d-kind.viaggio{background:var(--amber-soft);color:var(--amber-ink)}
.day .d-hrs{margin-left:auto;font-weight:800;color:var(--accent);font-family:var(--fdisplay)}
.day .d-note{padding:8px 15px 0;color:var(--muted);font-size:.92rem;white-space:pre-wrap;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.day .d-foot{display:flex;align-items:center;gap:12px;padding:12px 15px 14px;color:var(--faint);font-size:.82rem}
.day .d-foot .pills{display:flex;gap:6px;margin-left:auto}

/* forms */
label.fld{display:block;margin-bottom:12px}
label.fld .lab{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.01em}
.inp{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:11px 12px;min-height:44px;color:var(--ink)}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea.inp{min-height:120px;resize:vertical;line-height:1.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-t{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
@media(max-width:460px){.grid-t{grid-template-columns:1fr 1fr}}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;width:max-content}
.seg button{background:var(--surface-2);border:none;padding:9px 16px;color:var(--muted);font-weight:600;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* appunti + traduzione */
.trrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.trrow .lab{margin:0}
.partial{min-height:0;color:var(--accent);font-size:.9rem;font-style:italic;padding:4px 2px 0}

/* hours readout */
.hreadout{display:flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent);
  border-radius:var(--radius-sm);padding:10px 13px;font-weight:700;margin-bottom:12px}
.hreadout .lbl{font-weight:600;color:var(--muted);font-size:.85rem}

/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px;margin-top:4px}
.ph{position:relative;aspect-ratio:1;border-radius:var(--radius-sm);overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .del{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:none;
  background:rgba(0,0,0,.55);color:#fff;font-size:1rem;line-height:1;display:flex;align-items:center;justify-content:center}
.ph .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.6));
  color:#fff;font-size:.68rem;padding:10px 5px 4px;border:none;width:100%;text-align:left}
.ph.add{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;
  color:var(--muted);border-style:dashed;cursor:pointer;font-size:.72rem;font-weight:600}
.ph.add svg{opacity:.7}

/* totals */
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 4px}
.tcell{border:none;border-radius:var(--radius);padding:14px 12px;box-shadow:var(--shadow)}
.tcell.c1{background:var(--accent-soft)} .tcell.c1 .v{color:var(--accent)}
.tcell.c2{background:var(--amber-soft)} .tcell.c2 .v{color:var(--amber-ink)}
.tcell.c3{background:var(--violet-soft)} .tcell.c3 .v{color:var(--violet)}
.tcell .v{font-family:var(--fdisplay);font-weight:700;font-size:1.6rem;line-height:1.1}
.tcell .k{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-top:2px}

/* empty */
.empty{text-align:center;padding:44px 16px;color:var(--muted)}
.empty h2{font-size:1.3rem;margin-bottom:8px;color:var(--ink)}
.empty p{max-width:34ch;margin:0 auto 18px}

/* fab */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));
  z-index:12;border:none;border-radius:999px;background:var(--grad);color:#fff;
  font-weight:700;font-size:1.02rem;padding:16px 22px;box-shadow:0 10px 26px rgba(120,70,220,.45);
  display:flex;align-items:center;gap:8px;transition:transform .12s}
.fab:hover{transform:translateY(-2px) scale(1.02)}

/* report output */
.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:24px;line-height:1.55}
.report h1{font-size:1.5rem;margin-bottom:2px}
.report .sub{color:var(--muted);margin-bottom:18px}
.report .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:.92rem;margin-bottom:18px}
.report .kv dt{color:var(--faint);font-weight:600}
.report .kv dd{margin:0;font-weight:500}
.report .r-day{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.report .r-day h3{font-size:1.02rem;display:flex;gap:10px;align-items:baseline}
.report .r-day h3 .h{margin-left:auto;color:var(--accent);font-size:.9rem;font-weight:700}
.report .r-day p{white-space:pre-wrap;margin:6px 0 0;color:var(--ink)}
.report .r-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.report .r-photos figure{margin:0}
.report .r-photos img{width:100%;border-radius:8px;border:1px solid var(--line);display:block}
.report .r-photos figcaption{font-size:.72rem;color:var(--muted);margin-top:3px}
.report .r-tot{margin-top:18px;border-top:2px solid var(--ink);padding-top:12px;font-weight:600}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:.9rem;
  z-index:30;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.saveind{font-size:.75rem;color:var(--faint);display:flex;align-items:center;gap:5px}
.saveind b{color:var(--ok);font-weight:600}

.hint{font-size:.82rem;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:14px;display:flex;gap:8px}
.hint svg{flex-shrink:0;color:var(--accent);margin-top:1px}
.muted{color:var(--muted)}
.danger-zone{margin-top:28px;text-align:center}
.app-ver{text-align:center;font-size:.72rem;color:var(--faint);margin-top:4px}
.backup-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0 0}
hr.soft{border:none;border-top:1px solid var(--line);margin:18px 0}

/* paga / trasferta */
.payentry{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:none;
  background:var(--grad);color:#fff;border-radius:var(--radius);padding:14px 16px;margin:10px 0 2px;
  box-shadow:var(--shadow-col);transition:transform .12s}
.payentry:active{transform:scale(.99)}
.payentry .pe-ic{display:flex}
.payentry .pe-tx{display:flex;flex-direction:column;line-height:1.2}
.payentry .pe-tx b{font-size:1.02rem}
.payentry .pe-tx small{opacity:.92;font-size:.77rem}
.payentry .pe-go{margin-left:auto;font-size:1.5rem;opacity:.9}
.paycard{background:var(--grad);color:#fff;border-radius:var(--radius);padding:18px;margin:4px 0 16px;
  box-shadow:0 12px 30px rgba(90,70,220,.3)}
.paytot{font-family:var(--fdisplay);font-size:2.3rem;font-weight:800;margin:2px 0 0;color:#fff}
.paysub{opacity:.9;font-size:.82rem;margin-bottom:12px}
.paybar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.22)}
.paybar span{height:100%}
.seg-ord{background:#dfe6ff}.seg-ot{background:#ffd27a}.seg-fest{background:#ff9bb6}.seg-trav{background:#b9f1dd}
.paylegend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:.78rem;opacity:.96}
.paylegend i.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}
.dot.d-ord{background:#dfe6ff}.dot.d-ot{background:#ffd27a}.dot.d-fest{background:#ff9bb6}.dot.d-trav{background:#b9f1dd}
.prow{display:flex;align-items:baseline;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.prow .pl{font-weight:600}
.prow .pd{font-size:.8rem}
.prow .pv{margin-left:auto;font-weight:700;font-family:var(--fdisplay);white-space:nowrap}
.prow.ptotal{border-bottom:none;margin-top:4px;border-top:2px solid var(--accent);padding-top:12px}
.prow.ptotal .pl,.prow.ptotal .pv{font-size:1.12rem;color:var(--accent)}
.inpwrap{position:relative;display:flex;align-items:center}
.inpwrap .suf{position:absolute;right:12px;color:var(--muted);font-size:.85rem;pointer-events:none}
.inpwrap .inp{padding-right:44px;width:100%}
.eyebrow svg{vertical-align:-3px;margin-right:4px}
.paygrp{font-weight:700;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 6px}
.linkbtn{background:none;border:none;color:var(--accent);font-size:.82rem;padding:0;cursor:pointer;text-decoration:underline;font-weight:600}
.ratebox summary{cursor:pointer;font-size:.95rem;list-style:none}
.ratebox summary::-webkit-details-marker{display:none}
.ratebox summary::before{content:"⚙ ";color:var(--accent)}
.paylegend i.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}
/* check-in / check-out */
.ckrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 14px}
.ckcol{display:flex;flex-direction:column;gap:6px}
.ckbtn{border:none;border-radius:var(--radius-sm);min-height:52px;font-weight:700;font-size:1.02rem;color:#fff;
  background:linear-gradient(135deg,#14b57e,#0e9b6b);box-shadow:var(--shadow)}
.ckbtn.out{background:linear-gradient(135deg,#ff7a45,#ff4757)}
.ckbtn.done{filter:saturate(.55) brightness(1.05)}

const PEND_KEY = 'diario_cantiere_pending';
function isPending(){ try{ return localStorage.getItem(PEND_KEY)==='1'; }catch(e){ return false; } }
function setPending(v){ try{ v?localStorage.setItem(PEND_KEY,'1'):localStorage.removeItem(PEND_KEY); }catch(e){} }
function idb(){ return new Promise((res,rej)=>{ const q=indexedDB.open('diario_cantiere',1); q.onupgradeneeded=()=>q.result.createObjectStore('kv'); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
async function idbGet(k){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction('kv').objectStore('kv').get(k); t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); }); }
async function idbSet(k,v){ const db=await idb(); return new Promise((res,rej)=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function readLocal(){
  try{ const v=await idbGet(LS_KEY); if(v&&Array.isArray(v.reports)) return v; }catch(e){}
  try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const p=JSON.parse(raw); if(p&&Array.isArray(p.reports)) return p; } }catch(e){}
  return null;
}
async function loadWorkspace(){
  const local = await readLocal();
  const ref = docRef();
  if(ref){
    try{
      const snap = await ref.get();
      const d = snap.exists ? snap.data() : null;
      const cloudOk = d && Array.isArray(d.reports);
      // modifiche fatte offline non ancora sincronizzate e più recenti del cloud: vince il telefono
      const localNewer = local && isPending() && (!cloudOk || (local.updatedAt||'') > (d.updatedAt||''));
      if(localNewer){ WS = { reports: local.reports }; setTimeout(saveNow, 300); return; }
      if(cloudOk){
        // i dati dal db arrivano "congelati" (read-only): ne faccio una copia modificabile
        WS = { reports: JSON.parse(JSON.stringify(d.reports)) };
        try{ localStorage.setItem(LS_KEY, JSON.stringify({reports:WS.reports, updatedAt:d.updatedAt||''})); }catch(e){}
        return;
      }
    }catch(e){ /* offline o db non raggiungibile: uso la copia sul telefono */ }
  }
  if(local) WS = { reports: local.reports };
}
function scheduleSave(){ dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,700); updateSaveInd('…'); }
async function saveNow(){
  if(saving){ return; } dirty=false; saving=true;
  const payload = {reports:WS.reports, updatedAt:new Date().toISOString()};
  try{ await idbSet(LS_KEY, payload); }catch(e){ toast('Errore di salvataggio sul telefono'); }
  const ref = docRef();
  if(ref){
    setPending(true);
    try{
      if(navigator.onLine===false) throw new Error('offline');
      await ref.set(payload); setPending(false); updateSaveInd('ok');
    }catch(e){ updateSaveInd('pending'); }
  } else { updateSaveInd('local'); }
  saving=false; paintChip();
  if(dirty){ saveNow(); }
}
// appena torna la rete (o riapri l'app) invio le modifiche rimaste in sospeso
function retrySync(){ if(docRef() && isPending() && navigator.onLine!==false && !saving){ saveNow(); } else paintChip(); }
window.addEventListener('online', retrySync);
window.addEventListener('offline', paintChip);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) retrySync(); });
setInterval(retrySync, 30000);
function paintChip(){
  const chip=document.getElementById('syncChip'); if(!chip) return;
  if(!(CAP.db && CAP.uid)){ chip.textContent=navigator.onLine===false?'offline · sul telefono':'sul telefono'; chip.classList.remove('sync'); return; }
  if(navigator.onLine===false){ chip.textContent='offline · salvo sul telefono'; chip.classList.remove('sync'); }
  else if(isPending()){ chip.textContent='da sincronizzare'; chip.classList.remove('sync'); }
  else { chip.textContent='● sincronizzato'; chip.classList.add('sync'); }
}
function updateSaveInd(st){
  const el=document.getElementById('saveInd'); if(!el) return;
  if(st==='…') el.innerHTML='salvataggio…';
  else if(st==='ok') el.innerHTML='<b>✓ salvato &amp; sincronizzato</b>';
  else if(st==='pending') el.innerHTML='<b>✓ salvato sul telefono</b> · si sincronizza appena torna la rete';
  else el.innerHTML='<b>✓ salvato</b> su questo dispositivo';
}

/* ---------- helpers ---------- */
function getReport(id){ return WS.reports.find(r=>r.id===id); }
function getDay(r,id){ return r && r.days.find(d=>d.id===id); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso;
  return d.toLocaleDateString('it-IT',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateShort(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso;
  return d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function diffH(a,b){ if(!a||!b) return 0; const [h1,m1]=a.split(':').map(Number),[h2,m2]=b.split(':').map(Number);
  let m=(h2*60+m2)-(h1*60+m1); if(m<0) m+=24*60; return m/60; }
function dayHours(d){
  // check-in/out: se c'è il check-in, il totale viene da lì (0 finché non fai check-out), meno l'eventuale pausa pranzo
  if(d.checkIn){ if(!d.checkOut) return 0;
    let h=diffH(d.checkIn,d.checkOut);
    if(d.type==='viaggio'){ const t=travelSpan(d); if(t!=null) h=t; }
    // giornata di lavoro: inizio = partenza dall'hotel, fine = arrivo in hotel → tolgo anche il trasferimento (contato come viaggio)
    return Math.max(0, h - (d.lunch?(Number(d.lunchMin)||60)/60:0) - (d.type!=='viaggio'?commuteH(d):0)); }
  if(d.type==='viaggio'){ return Number(d.travelHours)||0; }
  if(d.workHours!=null&&String(d.workHours).trim()!=='') return num(d.workHours,0); // totale ore scritto a mano
  return diffH(d.amStart,d.amEnd)+diffH(d.pmStart,d.pmEnd); }

const tzCache={};
function tzValid(tz){ try{ new Intl.DateTimeFormat('en',{timeZone:tz}); return true; }catch(e){ return false; } }
function tzOffH(tz,iso){ try{
  const d=new Date((iso||new Date().toISOString().slice(0,10))+'T12:00:00Z');
  const p=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(d);
  const g=t=>+p.find(x=>x.type===t).value;
  return (Date.UTC(g('year'),g('month')-1,g('day'),g('hour')%24,g('minute'))-d.getTime())/3600000; }catch(e){ return null; } }
function utcLab(o){ if(o==null) return ''; const s=o<0?'−':'+', a=Math.abs(o), h=Math.floor(a), m=Math.round((a-h)*60); return 'UTC'+s+h+(m?':'+String(m).padStart(2,'0'):''); }
async function resolveTz(txt){
  const k=String(txt||'').trim().toLowerCase(); if(!k) return null;
  if(tzCache[k]) return tzCache[k];
  const t=' '+k.replace(/[.,;()\/-]/g,' ')+' ';
  const hit=TZ_WORDS.find(w=>t.includes(' '+w[0]+' '));
  if(hit) return tzCache[k]=hit[1];
  if(!CAP.sample) return null;
  try{ const out=await sjson(`Luogo: "${String(txt).slice(0,120)}". Qual è il fuso orario IANA di questo luogo? Rispondi SOLO con JSON: {"tz":"Area/Città, es. Europe/Rome"}`,{modelTier:'quick'});
    if(out&&out.tz&&tzValid(out.tz)) return tzCache[k]=out.tz; }catch(e){}
  return null;
}
// ricalcola lo sfasamento (ore) partenza → arrivo per la data del viaggio
function updTzShift(d){
  const a=d.fromTz?tzOffH(d.fromTz,d.date):null, b=d.toTz?tzOffH(d.toTz,d.date):null;
  const v=(a!=null&&b!=null)? Math.round((a-b)*100)/100 : 0;
  const ch=Number(d.tzShift||0)!==v; d.tzShift=v; return ch;
}
function localISO(){ const n=new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0'); }
function isoDays(a,b){ return Math.round((new Date(b+'T12:00:00Z')-new Date(a+'T12:00:00Z'))/86400000); }
/* durata viaggio: da (data giornata + check-in, ora locale partenza) a (data arrivo + check-out, ora locale arrivo), corretta col fuso.
   Se la data d'arrivo è nota (check-out col pulsante o scritta a mano) uso le date vere → anche viaggi oltre 24h.
   Senza data d'arrivo (vecchie giornate): se l'orario d'arrivo è "prima" della partenza vale il giorno dopo. */
function travelSpan(d){
  if(!d.checkIn||!d.checkOut) return null;
  const sh=Number(d.tzShift||0);
  const [h1,m1]=d.checkIn.split(':').map(Number),[h2,m2]=d.checkOut.split(':').map(Number);
  const clock=((h2*60+m2)-(h1*60+m1))/60;
  if(d.checkOutDate&&d.date){ return isoDays(d.date,d.checkOutDate)*24+clock+sh; }
  let h=clock+sh; while(h<0) h+=24; return h;
}
function nowHM(){ const n=new Date(); return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); }
function fmtLunch(m){ m=Number(m)||60; return m<60? m+' min' : fmtH(m/60); }
/* trasferimento hotel ↔ cantiere nelle giornate di lavoro: conta come ore viaggio.
   Accetta 1,5 · 1.5 · 1:30 · 1h30 · 90' (minuti) */
function parseDur(v){ const s=String(v==null?'':v).trim().toLowerCase().replace(/\s+/g,''); if(!s) return 0;
  let m=s.match(/^(\d+)[:h](\d{1,2})?m?$/); if(m) return Number(m[1])+(Number(m[2]||0))/60;
  m=s.match(/^(\d+)(?:'|min|m)$/); if(m) return Number(m[1])/60;
  const n=parseFloat(s.replace(',','.')); return isNaN(n)?0:Math.max(0,n); }
function commuteH(d){ return d && d.type!=='viaggio' ? parseDur(d.commuteOut)+parseDur(d.commuteBack) : 0; }
function commuteTxt(d){ const a=parseDur(d.commuteOut), b=parseDur(d.commuteBack); if(!a&&!b) return '';
  return 'Trasferimento hotel–cantiere: andata '+fmtH(a)+', ritorno '+fmtH(b); }
function fmtH(h){ if(!h) return '0h'; const H=Math.floor(h),M=Math.round((h-H)*60); return M?`${H}h${String(M).padStart(2,'0')}`:`${H}h`; }
function reportTotals(r){ let work=0,travel=0,days=0; r.days.forEach(d=>{ if(d.type==='viaggio') travel+=dayHours(d); else {work+=dayHours(d); travel+=commuteH(d); days++;} }); return {work,travel,days}; }
function dateRange(r){ const ds=r.days.map(d=>d.date).filter(Boolean).sort(); if(!ds.length) return '—';
  return ds[0]===ds[ds.length-1]? fmtDateShort(ds[0]) : fmtDateShort(ds[0])+' – '+fmtDateShort(ds[ds.length-1]); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function assetURL(id){ if(!id) return ''; return urlCache[id] || ('/_blob/'+id); }

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');

/* ---------- navigation ---------- */
function go(name,opts={}){ view={name, reportId:opts.reportId??view.reportId, dayId:opts.dayId??null};
  window.scrollTo(0,0); render(); }
document.getElementById('homeBtn').addEventListener('click',()=>go('home'));
document.getElementById('backBtn').addEventListener('click',()=>{
  if(view.name==='day'||view.name==='pay'||view.name==='header') go('report');
  else if(view.name==='report'||view.name==='output') go('home');
  else go('home');
});

/* ---------- delega globale: i click funzionano sempre, anche se un
   ri-disegno non riaggancia gli handler ---------- */
document.addEventListener('click', function(e){
  const t = e.target.closest && e.target.closest('[data-act]');
  if(!t) return;
  const a = t.dataset.act;
  try{
    if(a==='new') newReport();
    else if(a==='word') importWord();
  }catch(err){
    try{ toast('Errore: '+(err && err.message || err)); }catch(_){}
    try{ alert('Errore creando il cantiere:\n'+(err && err.message || err)); }catch(_){}
  }
});
/* qualunque errore JS non gestito diventa visibile a schermo.
   Gli errori di caricamento risorsa (es. una foto non più disponibile)
   NON sono bug dell'app: li ignoriamo invece di spaventare con un toast. */
window.addEventListener('error', function(ev){
  if(ev && ev.target && ev.target!==window && ev.target.tagName) return; // img/script che non carica
  var msg = ev.message||'';
  if(ev.filename) msg += ' ('+(ev.lineno||'?')+':'+(ev.colno||'?')+')';
  try{ toast('Errore: '+(msg||'imprevisto')); }catch(_){}
}, true);

/* ---------- RENDER ---------- */
function render(){
  const back=document.getElementById('backBtn'), title=document.getElementById('barTitle');
  const r=getReport(view.reportId);
  back.hidden = view.name==='home';
  title.textContent = view.name==='home' ? 'Diario Cantiere'
    : (r? r.customer||'Cantiere' : 'Cantiere');
  if(view.name==='home') renderHome();
  else if(view.name==='report') renderReport(r);
  else if(view.name==='day') renderDay(r,getDay(r,view.dayId));
  else if(view.name==='header') renderHeader(r);
  else if(view.name==='output') renderOutput(r);
  else if(view.name==='pay') renderPay(r);
  // logo ACMI in cima a OGNI schermata (la home lo ha già)
  try{ if(!$app.querySelector('.acmi-logo')) $app.insertAdjacentHTML('afterbegin', ACMI_LOGO); }catch(_){}
}

/* scorrimento da destra a sinistra sui cantieri -> azioni rapide */
function setupSwipe(){
  const rows=[...$app.querySelectorAll('.swipe')];
  let openRow=null;
  const actW=row=>row.querySelector('.swipe-acts').offsetWidth;
  const setX=(row,x)=>{ row.querySelector('.site-card').style.transform = x? `translateX(${x}px)` : ''; };
  const close=row=>{ if(row){ setX(row,0); row.classList.remove('open'); } if(openRow===row) openRow=null; };
  const open=row=>{ if(openRow&&openRow!==row) close(openRow); setX(row,-actW(row)); row.classList.add('open'); openRow=row; };

  rows.forEach(row=>{
    const card=row.querySelector('.site-card'), id=row.dataset.id;
    let sx=0, sy=0, base=0, dx=0, mode=null, moved=false, pid=null;
    card.addEventListener('pointerdown',e=>{
      if(e.pointerType==='mouse'&&e.button!==0) return;
      pid=e.pointerId; sx=e.clientX; sy=e.clientY; dx=0; mode=null; moved=false;
      base=row.classList.contains('open')? -actW(row) : 0;
    });
    card.addEventListener('pointermove',e=>{
      if(e.pointerId!==pid) return;
      const mx=e.clientX-sx, my=e.clientY-sy;
      if(!mode){
        if(Math.abs(mx)<8&&Math.abs(my)<8) return;
        mode = Math.abs(mx)>Math.abs(my)? 'h':'v';
        if(mode==='h'){ row.classList.add('dragging'); try{card.setPointerCapture(pid);}catch(_){} if(openRow&&openRow!==row) close(openRow); }
      }
      if(mode!=='h') return;
      moved=true;
      const w=actW(row);
      dx=Math.min(0,Math.max(-w-30,base+mx));
      setX(row,dx);
    });
    const end=e=>{
      if(e.pointerId!==pid) return; pid=null;
      row.classList.remove('dragging');
      if(mode==='h'){ (dx < -actW(row)*0.4)? open(row) : close(row); }
      mode=null;
    };
    card.addEventListener('pointerup',end);
    card.addEventListener('pointercancel',end);
    card.addEventListener('click',e=>{
      if(moved){ moved=false; e.preventDefault(); return; }
      if(row.classList.contains('open')){ close(row); return; }
      go('report',{reportId:id});
    });
    row.querySelectorAll('.swipe-acts button').forEach(b=>b.onclick=async e=>{
      e.stopPropagation();
      const r=getReport(id); if(!r) return;
      const a=b.dataset.sa;
      if(a==='edit') go('header',{reportId:id});
      else if(a==='word') go('output',{reportId:id});
      else if(a==='dup'){
        const c=JSON.parse(JSON.stringify(r));
        c.id=uid(); c.days=[]; c.conclusion=''; c.fdl=''; c.createdAt=new Date().toISOString();
        c.customer=(r.customer||'Cantiere')+' (copia)';
        WS.reports.push(c); scheduleSave(); toast('Cantiere duplicato'); render();
      }
      else if(a==='del'){
        close(row);
        if(await confirmAsync(`Eliminare il cantiere "${r.customer||'Senza nome'}" e tutte le sue giornate?`)){
          WS.reports=WS.reports.filter(x=>x.id!==id); scheduleSave(); toast('Cantiere eliminato'); render();
        }
      }
    });
  });
  // tocco fuori da un cantiere aperto -> si richiude
  if(!window.__swipeDocBound){
    window.__swipeDocBound=true;
    document.addEventListener('pointerdown',e=>{
      const o=document.querySelector('.swipe.open');
      if(o && !o.contains(e.target)){ o.querySelector('.site-card').style.transform=''; o.classList.remove('open'); }
    });
  }
}

/* DAY ---- editor giornata (costruito a mano, non ri-renderizzato mentre scrivi) */
function renderDay(r,d){
  if(!r||!d){ go('report'); return; }
  $app.innerHTML='';
  const wrap=document.createElement('div');

  // data + tipo
  const top=document.createElement('div'); top.className='card pad'; top.style.marginBottom='14px';
  top.innerHTML=`
    <label class="fld"><span class="lab">Data</span><input type="date" class="inp" id="fDate" value="${d.date||''}"></label>
    <span class="lab">Tipo giornata</span>
    <div class="seg" role="group" style="margin-bottom:4px">
      <button id="kLav" aria-pressed="${d.type!=='viaggio'}">Lavoro</button>
      <button id="kVia" aria-pressed="${d.type==='viaggio'}">Viaggio</button>
    </div>`;
  wrap.appendChild(top);

  // ore
  const hours=document.createElement('div'); hours.className='card pad'; hours.style.marginBottom='14px';
  wrap.appendChild(hours);
  function hoursLabel(){ return (d.checkIn&&!d.checkOut) ? 'in corso' : fmtH(dayHours(d)); }
  function stateText(){
    const lm=Number(d.lunchMin)||60; const sh=d.type==='viaggio'?Number(d.tzShift||0):0;
    if(d.checkIn&&!d.checkOut) return `Entrato alle <b>${d.checkIn}</b> — premi Check-out a fine ${d.type==='viaggio'?'viaggio':'giornata'}`;
    if(d.checkIn&&d.checkOut&&d.type==='viaggio'){
      const ad=d.checkOutDate||'', t=travelSpan(d);
      const dl=iso=>iso?fmtDateShort(iso):'';
      const warn=(t!=null&&(t<0||t>36))?`<br><b style="color:var(--rec)">⚠ ${t<0?'Arrivo prima della partenza':'Viaggio di '+fmtH(t)}: controlla la data di arrivo</b>`:'';
      return `${dl(d.date)} ${d.checkIn} → ${ad&&ad!==d.date?dl(ad)+' ':''}${d.checkOut}${sh?` &nbsp;${sh>0?'+':'−'}&nbsp;fuso ${fmtH(Math.abs(sh))}`:''}${d.lunch?` &nbsp;−&nbsp; pausa ${fmtLunch(lm)}`:''} &nbsp;=&nbsp; <b>${fmtH(dayHours(d))}</b>${warn}`;
    }
    if(d.checkIn&&d.checkOut) return `${d.checkIn} → ${d.checkOut}${sh?` &nbsp;${sh>0?'+':'−'}&nbsp;fuso ${fmtH(Math.abs(sh))}`:''}${d.lunch?` &nbsp;−&nbsp; pausa ${fmtLunch(lm)}`:' &nbsp;·&nbsp; senza pausa'} &nbsp;=&nbsp; <b>${fmtH(dayHours(d))}</b>`;
    return '';
  }
  function renderCkState(){ const el=hours.querySelector('.ckstate'); const st=stateText(); if(el){ el.innerHTML=st; el.hidden=!st; } }
  function checkBlockHTML(){
    const lm=Number(d.lunchMin)||60;
    const state=stateText();
    return `<span class="lab">Check-in / Check-out</span>
      <div class="ckrow">
        <div class="ckcol">
          <button class="ckbtn ${d.checkIn?'done':''}" id="ckIn">${d.checkIn?'✓ Check-in':'Check-in'}</button>
          <input type="time" class="inp" id="ckInT" value="${d.checkIn||''}" aria-label="Ora di check-in">
        </div>
        <div class="ckcol">
          <button class="ckbtn out ${d.checkOut?'done':''}" id="ckOut">${d.checkOut?'✓ Check-out':'Check-out'}</button>
          <input type="time" class="inp" id="ckOutT" value="${d.checkOut||''}" aria-label="Ora di check-out">
          ${d.type==='viaggio'?`<label class="fld" style="margin:0"><span class="lab">Data arrivo</span><input type="date" class="inp" id="ckOutD" value="${d.checkOutDate||d.date||''}"></label>`:''}
        </div>
      </div>
      <span class="lab">Pausa pranzo</span>
      <div class="row" style="align-items:center;margin-bottom:12px">
        <div class="seg" role="group"><button id="luNo" aria-pressed="${!d.lunch}">No</button><button id="luSi" aria-pressed="${!!d.lunch}">Sì</button></div>
        <select class="inp" id="luMin" style="width:auto;min-width:110px" ${d.lunch?'':'hidden'}>${[30,45,60,90].map(m=>`<option value="${m}" ${m===lm?'selected':''}>${fmtLunch(m)}</option>`).join('')}</select>
      </div>
      <div class="ckstate" ${state?'':'hidden'}>${state}</div>
      ${d.checkIn||d.checkOut?'<button class="linkbtn" id="ckReset" style="margin-bottom:12px">Azzera check-in/out (torna agli orari a mano)</button>':''}`;
  }
  function wireCheck(){
    const save=()=>{ scheduleSave(); renderHoursBlock(); };
    hours.querySelector('#ckIn').onclick=()=>{
      if(d.checkIn){ toast('Check-in già fatto alle '+d.checkIn+' — puoi correggere l\'ora qui sotto'); return; }
      d.checkIn=nowHM(); d.checkOut=''; d.checkOutDate='';
      if(d.type==='viaggio'&&d.date!==localISO()){ d.date=localISO(); const fd=top.querySelector('#fDate'); if(fd) fd.value=d.date; } // la giornata di viaggio parte oggi
      save(); toast('Check-in alle '+d.checkIn); };
    hours.querySelector('#ckOut').onclick=async()=>{
      if(!d.checkIn){ toast('Prima fai il check-in'); return; }
      d.checkOut=nowHM(); if(d.type==='viaggio') d.checkOutDate=localISO();
      if(d.lunch===undefined){ const m=await askLunch(); d.lunch=m>0; if(m>0) d.lunchMin=m; }
      save(); toast('Totale giornata: '+fmtH(dayHours(d))+(d.lunch?' (pausa scalata)':'')); };
    // ora scelta a mano: aggiorno senza ridisegnare, così il selettore dell'ora resta aperto
    const soft=()=>{ scheduleSave(); renderCkState();
      const o=hours.querySelector('#hOut'); if(o) o.textContent=hoursLabel();
      const bi=hours.querySelector('#ckIn'), bo=hours.querySelector('#ckOut');
      bi.classList.toggle('done',!!d.checkIn); bi.textContent=d.checkIn?'✓ Check-in':'Check-in';
      bo.classList.toggle('done',!!d.checkOut); bo.textContent=d.checkOut?'✓ Check-out':'Check-out'; };
    hours.querySelector('#ckInT').addEventListener('change',e=>{ d.checkIn=e.target.value; soft(); });
    hours.querySelector('#ckOutT').addEventListener('change',e=>{ d.checkOut=e.target.value; soft(); });
    hours.querySelector('#luNo').onclick=()=>{ d.lunch=false; save(); };
    hours.querySelector('#luSi').onclick=()=>{ d.lunch=true; if(!d.lunchMin) d.lunchMin=60; save(); };
    hours.querySelector('#luMin').addEventListener('change',e=>{ d.lunchMin=Number(e.target.value); save(); });
    const rs=hours.querySelector('#ckReset'); if(rs) rs.onclick=()=>{ d.checkIn=''; d.checkOut=''; d.checkOutDate=''; save(); };
    const da=hours.querySelector('#ckOutD'); if(da) da.addEventListener('change',e=>{ d.checkOutDate=e.target.value; soft(); });
  }
  function manualOpen(){ return d.checkIn? '' : 'open'; }
  function renderHoursBlock(){
    if(d.type==='viaggio'){
      if(updTzShift(d)) scheduleSave();
      hours.innerHTML=`<div class="grid2">
          <label class="fld"><span class="lab">Partenza da</span><input class="inp" id="fFrom" value="${esc(d.fromPlace||'')}" placeholder="es. Tbilisi"></label>
          <label class="fld"><span class="lab">Arrivo a</span><input class="inp" id="fTo" value="${esc(d.toPlace||'')}" placeholder="es. Verona"></label></div>
        <div class="muted" id="tzInfo" style="font-size:.82rem;margin:-4px 0 12px"></div>
        <div class="muted" style="font-size:.78rem;margin:-6px 0 10px">Check-in con l'ora locale della partenza, check-out con l'ora locale dell'arrivo: il fuso lo correggo io.</div>`
        +checkBlockHTML()+`<details class="manual" ${manualOpen()}><summary>Ore di viaggio a mano</summary>
        <label class="fld"><span class="lab">Ore di viaggio</span>
        <input class="inp" id="fTravel" inputmode="decimal" placeholder="es. 15" value="${esc(d.travelHours||'')}"></label></details>
        <div class="hreadout"><span class="lbl">Totale giornata</span><span class="num" id="hOut">${hoursLabel()}</span></div>`;
      hours.querySelector('#fTravel').addEventListener('input',e=>{ d.travelHours=e.target.value.replace(',','.'); hours.querySelector('#hOut').textContent=hoursLabel(); scheduleSave(); });
      wireCheck();
      const tzInfo=hours.querySelector('#tzInfo');
      const showTz=()=>{
        if(!d.fromPlace&&!d.toPlace){ tzInfo.textContent=''; return; }
        const a=d.fromTz?tzOffH(d.fromTz,d.date):null, b=d.toTz?tzOffH(d.toTz,d.date):null;
        if(a==null||b==null){ tzInfo.textContent=(d.fromPlace&&d.toPlace)?'Fuso orario non riconosciuto per '+(a==null?d.fromPlace:d.toPlace):''; return; }
        const s=d.tzShift||0;
        tzInfo.innerHTML=`${esc(d.fromPlace)} (${utcLab(a)}) → ${esc(d.toPlace)} (${utcLab(b)}): `+(s? `<b>${s>0?'+':'−'}${fmtH(Math.abs(s))}</b> sul totale` : 'stesso fuso');
      };
      let tzT=null, tzSeq=0;
      const resolveBoth=async()=>{ const my=++tzSeq; tzInfo.textContent='Cerco il fuso orario…';
        const [fa,fb]=await Promise.all([resolveTz(d.fromPlace),resolveTz(d.toPlace)]); if(my!==tzSeq) return;
        d.fromTz=fa||''; d.toTz=fb||''; updTzShift(d); scheduleSave();
        hours.querySelector('#hOut').textContent=hoursLabel(); renderCkState(); showTz(); };
      const onPlace=(k,v)=>{ d[k]=v; scheduleSave(); clearTimeout(tzT); tzT=setTimeout(resolveBoth,900); };
      hours.querySelector('#fFrom').addEventListener('input',e=>onPlace('fromPlace',e.target.value));
      hours.querySelector('#fTo').addEventListener('input',e=>onPlace('toPlace',e.target.value));
      if((d.fromPlace&&!d.fromTz)||(d.toPlace&&!d.toTz)) resolveBoth(); else showTz();
    } else {
      hours.innerHTML=checkBlockHTML()+`<details class="manual" ${manualOpen()}><summary>Ore a mano</summary>
        <label class="fld"><span class="lab">Ore lavorate (scrivi solo il totale)</span>
        <input class="inp" id="fWork" inputmode="decimal" placeholder="es. 10,5" value="${esc(d.workHours||'')}"></label>
        <span class="lab">…oppure orario mattino</span>
        <div class="grid-t" style="margin-bottom:12px">
          <label class="fld" style="margin:0"><span class="lab">Dalle</span><input type="time" class="inp" id="am1" value="${d.amStart||''}"></label>
          <label class="fld" style="margin:0"><span class="lab">Alle</span><input type="time" class="inp" id="am2" value="${d.amEnd||''}"></label>
        </div>
        <span class="lab">Orario pomeriggio</span>
        <div class="grid-t" style="margin-bottom:12px">
          <label class="fld" style="margin:0"><span class="lab">Dalle</span><input type="time" class="inp" id="pm1" value="${d.pmStart||''}"></label>
          <label class="fld" style="margin:0"><span class="lab">Alle</span><input type="time" class="inp" id="pm2" value="${d.pmEnd||''}"></label>
        </div></details>
        <div class="hreadout"><span class="lbl">Totale giornata</span><span class="num" id="hOut">${hoursLabel()}</span></div>
        <span class="lab" style="display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:5px">Trasferimento hotel ↔ cantiere (conta come ore viaggio)</span>
        <div class="grid-t" style="margin-bottom:12px">
          <label class="fld" style="margin:0"><span class="lab">Andata</span><input class="inp" id="cOut" inputmode="decimal" placeholder="es. 1:15" value="${esc(d.commuteOut||'')}"></label>
          <label class="fld" style="margin:0"><span class="lab">Ritorno</span><input class="inp" id="cBack" inputmode="decimal" placeholder="es. 1:30" value="${esc(d.commuteBack||'')}"></label>
        </div>
        <div class="hreadout" id="cRead" style="background:var(--amber-soft);color:var(--amber-ink)" ${commuteH(d)?'':'hidden'}><span class="lbl">Viaggio trasferimento</span><span class="num" id="cOutH">${fmtH(commuteH(d))}</span></div>`;
      const upd=()=>{ d.amStart=hours.querySelector('#am1').value; d.amEnd=hours.querySelector('#am2').value;
        d.pmStart=hours.querySelector('#pm1').value; d.pmEnd=hours.querySelector('#pm2').value;
        hours.querySelector('#hOut').textContent=hoursLabel(); scheduleSave(); };
      ['am1','am2','pm1','pm2'].forEach(id=>hours.querySelector('#'+id).addEventListener('input',upd));
      const updC=()=>{ d.commuteOut=hours.querySelector('#cOut').value; d.commuteBack=hours.querySelector('#cBack').value;
        const c=commuteH(d); hours.querySelector('#cRead').hidden=!c; hours.querySelector('#cOutH').textContent=fmtH(c); scheduleSave(); };
      ['cOut','cBack'].forEach(id=>hours.querySelector('#'+id).addEventListener('input',updC));
      hours.querySelector('#fWork').addEventListener('input',e=>{ d.workHours=e.target.value.replace(',','.'); hours.querySelector('#hOut').textContent=hoursLabel(); scheduleSave(); });
      wireCheck();
    }
  }
  renderHoursBlock();
  top.querySelector('#fDate').addEventListener('input',e=>{ d.date=e.target.value; scheduleSave(); });
  top.querySelector('#kLav').onclick=()=>{ d.type='lavoro'; top.querySelector('#kLav').setAttribute('aria-pressed','true'); top.querySelector('#kVia').setAttribute('aria-pressed','false'); renderHoursBlock(); scheduleSave(); };
  top.querySelector('#kVia').onclick=()=>{ d.type='viaggio'; top.querySelector('#kVia').setAttribute('aria-pressed','true'); top.querySelector('#kLav').setAttribute('aria-pressed','false'); renderHoursBlock(); scheduleSave(); };

  // appunti + microfono
  const notes=document.createElement('div'); notes.className='card pad'; notes.style.marginBottom='14px';
  notes.innerHTML=`<span class="lab">Appunti del lavoro svolto</span>
    <textarea class="inp" id="fNotes" placeholder="Scrivi o detta con il 🎤 della tastiera cosa hai fatto oggi…">${esc(d.notes||'')}</textarea>
    <div class="trrow">
      <div class="seg" role="group" id="trSeg"><button data-lang="en">Inglese</button><button data-lang="fr">Francese</button></div>
      <button class="btn primary sm" id="trGo">Traduci</button>
      <button class="btn sm" id="clrNotes" style="color:var(--rec)">Cancella testo</button>
    </div>
    <div class="partial" id="partial"></div>`;
  wrap.appendChild(notes);
  const ta=notes.querySelector('#fNotes');
  ta.addEventListener('input',()=>{ d.notes=ta.value; scheduleSave(); });
  notes.querySelector('#clrNotes').onclick=async()=>{
    if(!ta.value.trim()){ toast('Nessun testo da cancellare'); return; }
    if(await confirmAsync('Cancellare tutto il testo degli appunti di questa giornata?')){
      ta.value=''; d.notes=''; scheduleSave(); toast('Testo cancellato');
    }
  };
  setupTr(notes.querySelector('#trSeg'), notes.querySelector('#trGo'), ta, d, notes.querySelector('#partial'));

  // foto
  const photos=document.createElement('div'); photos.className='card pad'; photos.style.marginBottom='14px';
  photos.innerHTML=`<span class="lab">Foto</span><div class="photos" id="phGrid"></div>
    <input type="file" id="phInput" accept="image/*" multiple hidden>`;
  wrap.appendChild(photos);
  renderPhotos(photos.querySelector('#phGrid'), photos.querySelector('#phInput'), d);

  // elimina giornata
  const dz=document.createElement('div'); dz.className='danger-zone';
  dz.innerHTML='<button class="btn danger" id="delDay">Elimina giornata</button>';
  wrap.appendChild(dz);
  dz.querySelector('#delDay').onclick=async()=>{ if(await confirmAsync('Eliminare questa giornata?')){ r.days=r.days.filter(x=>x.id!==d.id); scheduleSave(); go('report'); } };

  $app.appendChild(wrap);
}

/* ---------- Claude: chiamata JSON compatibile (anche app iPhone senza sample.json) ---------- */
function parseJSONText(t){
  t=String(t||'');
  const a=t.search(/[\[{]/); if(a<0) throw {code:'upstream_error'};
  const b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));
  return JSON.parse(t.slice(a,b+1));
}
async function sjson(prompt,opts){
  if(typeof CAP.sample.json==='function'){
    try{ return await CAP.sample.json(prompt,opts); }
    catch(e){ if(!(e&&e.code==='capability_removed')) throw e; }
  }
  const out=await CAP.sample(prompt,opts);
  return parseJSONText(out&&out.text);
}
function sampleErrMsg(e){
  const c=e&&e.code;
  if(c==='not_granted') return 'Non hai consentito all\'app di usare Claude (menu Permessi dell\'artifact)';
  if(c==='rate_limited') return 'Troppe richieste a Claude — riprova tra poco';

}

function downscale(file,max=1500,q=.72){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{ URL.revokeObjectURL(url);
      let {width:w,height:h}=img; if(w>max||h>max){ const s=max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(b=> b?resolve(b):reject(), 'image/jpeg', q);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(); };
    img.src=url;
  });
}
function blobToDataURL(b){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(b); }); }
// data:URL → Blob senza fetch (dentro Claude il fetch di data: è bloccato)
function dataURLtoBlob(u){ const i=u.indexOf(','); const meta=u.slice(5,i); const mime=meta.split(';')[0]||'image/jpeg';
  const bin=atob(u.slice(i+1)); const a=new Uint8Array(bin.length); for(let k=0;k<bin.length;k++) a[k]=bin.charCodeAt(k); return new Blob([a],{type:mime}); }
// foto arrivate da un backup del telefono: le porto nello spazio foto di Claude

// Base oraria esatta dal cedolino (voce BASE ORARIA): 3.131,11 / 173 = 18,09890 €/h.
// Gli straordinari sono base × (1 + maggiorazione): così i conti tornano al centesimo col cedolino.
const PAY_BASE=18.0989;
const PQ=0.2; // quota trattenuta sul netto escluse diarie (verificata sul cedolino)
// Quota esente delle diarie (art. 51 TUIR): dipende da cosa ti rimborsano a piè di lista.
// Il cedolino di ottobre usa 15,49 (Italia) e 25,82 (estero) = vitto + alloggio rimborsati.
const ESENZ={ both:{it:15.49,est:25.82,lab:'Vitto + alloggio rimborsati'},
  one:{it:30.99,est:51.65,lab:'Solo vitto o solo alloggio rimborsato'},
  none:{it:46.48,est:77.47,lab:'Nessun rimborso a piè di lista'} };
const ZONE={ italia:'Italia', europa:'Europa', extra:'Extra UE' };
function payRates(P){
  const b=num(P.rateOrd,PAY_BASE);
  return {
    rateOrd:b, rateTravel:num(P.rateTravel,b),
    ot25:num(P.ot25,b*1.25), ot30:num(P.ot30,b*1.30), ot50:num(P.ot50,b*1.50), ot55:num(P.ot55,b*1.55),
    dExtra:num(P.dExtra,101), dEuropa:num(P.dEuropa,78), dItalia:num(P.dItalia,36), rFest:num(P.rFest,120.43),
    inps:num(P.inps,10.49)/100, tax:num(P.tax,45)/100, esenz:ESENZ[P.esenz]||ESENZ.both
  };
}
/* festività nazionali italiane (contano come domenica). Dal 2026 torna festivo il 4 ottobre (San Francesco). */
function easterISO(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
  mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return new Date(Date.UTC(y,mo-1,da)); }
function itHoliday(iso){
  const y=+iso.slice(0,4), md=iso.slice(5);
  const fixed=['01-01','01-06','04-25','05-01','06-02','08-15','11-01','12-08','12-25','12-26'];
  if(y>=2026) fixed.push('10-04');
  if(fixed.includes(md)) return true;
  const em=easterISO(y); em.setUTCDate(em.getUTCDate()+1); // Lunedì dell'Angelo
  return em.toISOString().slice(0,10)===iso;
}

function zoneLocal(txt){
  const t=' '+String(txt||'').toLowerCase().replace(/[.,;()\/-]/g,' ')+' ';
  const has=w=>t.includes(' '+w+' ');
  if(EXTRA_WORDS.some(has)) return 'extra';
  if(EU_WORDS.some(has)) return 'europa';
  if(has('italia')||has('italy')) return 'italia';
  return null;
}
async function detectZone(txt){

    if(out&&ZONE[out.zona]) return {zona:out.zona,paese:String(out.paese||'').slice(0,40)};
  }catch(e){}

/* Smista le ore di ogni giorno nelle voci della busta (CCNL metalmeccanici, come nel cedolino):
   lun-ven: prime 8h di lavoro = ordinarie (già nello stipendio); oltre: prime 2h al 25%, poi 30%.
            viaggio: fino a completare le 8h con il lavoro = "entro 8h" (recuperate, 0 €); il resto = "oltre 8h" (pagate).
   sabato:  tutto il lavoro è straordinario (prime 2h 25%, poi 30%); viaggio tutto pagato.
   domenica e festivi: lavoro fino a 8h al 50%, oltre al 55%; viaggio tutto pagato. */
function classifyDays(r){
  const by={};
  r.days.forEach(d=>{ if(!d.date) return; const o=by[d.date]=by[d.date]||{date:d.date,w:0,t:0};
    if(d.type==='viaggio') o.t+=dayHours(d); else { o.w+=dayHours(d); o.t+=commuteH(d); } });
  const rows=Object.values(by).sort((a,b)=>a.date<b.date?-1:1);
  const T={ord:0,h25:0,h30:0,h50:0,h55:0,tOut:0,tIn:0,days:rows.length,fest:0};
  rows.forEach(o=>{
    const wd=new Date(o.date+'T12:00:00').getDay(), hol=itHoliday(o.date);
    o.kind= (wd===0||hol)?'festivo' : wd===6?'sabato':'feriale';
    o.lab=WD[wd]+(hol?' · festivo':'');
    o.ord=o.h25=o.h30=o.h50=o.h55=o.tIn=o.tOut=0;
    if(o.kind==='festivo'){ o.h50=Math.min(o.w,8); o.h55=Math.max(0,o.w-8); o.tOut=o.t; }
    else if(o.kind==='sabato'){ o.h25=Math.min(o.w,2); o.h30=Math.max(0,o.w-2); o.tOut=o.t; }
    else { o.ord=Math.min(o.w,8); const x=Math.max(0,o.w-8); o.h25=Math.min(x,2); o.h30=Math.max(0,x-2);
      o.tIn=Math.min(o.t,Math.max(0,8-o.w)); o.tOut=o.t-o.tIn; }
    ['ord','h25','h30','h50','h55','tIn','tOut'].forEach(k=>T[k]+=o[k]);
  });
  // festività non goduta: festività nazionale che cade di domenica, nel periodo del cantiere
  if(rows.length){ const s=new Date(rows[0].date+'T12:00:00'), e=new Date(rows[rows.length-1].date+'T12:00:00');
    for(let x=new Date(s);x<=e;x.setDate(x.getDate()+1)){ const iso=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
      if(x.getDay()===0&&itHoliday(iso)) T.fest++; } }
  return {rows,T};
}
function computePay(r){
  const P=r.pay||{}; const R=payRates(P); const {rows,T}=classifyDays(r);
  const zona=ZONE[P.zona]?P.zona:'italia';
  const L=(lab,key,qty,rate,unit,kind)=>({lab,key,qty,rate,unit,kind,imp:qty*rate});
  const lines=[
    L('Straordinario 25%','h25',T.h25,R.ot25,'h','tax'),
    L('Straordinario 30%','h30',T.h30,R.ot30,'h','tax'),
    L('Straordinario 50% (festivo)','h50',T.h50,R.ot50,'h','tax'),
    L('Straordinario 55% (festivo oltre 8h)','h55',T.h55,R.ot55,'h','tax'),
    L('Viaggio oltre 8h / sab-dom','hTravel',T.tOut,R.rateTravel,'h','tax'),
    L('Viaggio entro le 8h','hTravelIn',T.tIn,R.rateTravel,'h','tax'),
    zona==='extra'? L('Diaria Extra UE','gExtra',T.days,R.dExtra,'g','est')
      : zona==='europa'? L('Diaria Europa','gEuropa',T.days,R.dEuropa,'g','est')
      : L('Diaria Italia','gItalia',T.days,R.dItalia,'g','it'),
    L('Festività non goduta','gFest',T.fest,R.rFest,'g','tax')
  ];
  // voce 2393 "Recupero ore retribuite": le ore viaggio entro le 8h vengono pagate e poi ritrattenute
  const recupero=-lines.find(l=>l.key==='hTravelIn').imp;
  // diarie: quota esente e quota tassata (voci 5661/5662 del cedolino)
  let esente=0;
  lines.forEach(l=>{ if(l.kind==='it'||l.kind==='est'){ const cap=l.kind==='it'?R.esenz.it:R.esenz.est; l.free=Math.min(l.rate,cap)*l.qty; esente+=l.free; } });
  const other=num(P.otherAllow,0);
  const lordo=lines.reduce((s,l)=>s+l.imp,0)+recupero;
  const tassabile=Math.max(0,lordo-esente);
  const nf=(1-R.inps)*(1-R.tax);           // quanto resta di 1 € tassato
  const dGross=lines.filter(l=>l.kind==='it'||l.kind==='est').reduce((s,l)=>s+l.imp,0);
  const net0=esente+tassabile*nf;
  const netto=net0-PQ*(net0-dGross)+other;   // netto reale come in busta (rimborsi/altre voci non tassati)
  const totale=lordo+other;

/* ---------- genera file Word (.docx) dal MODULO ufficiale ACMI ---------- */
function xmlEsc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// testo con a capo -> run con interruzioni di riga valide in OOXML
function xmlMulti(s){ return xmlEsc(s).replace(/\r?\n/g,'</w:t><w:br/><w:t xml:space="preserve">'); }
// proprietà run: Arial 10 (sz in mezzi punti => 20), con grassetto opzionale
function rPrArial(bold){
  return '<w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>'+(bold?'<w:b/>':'')+'<w:sz w:val="20"/><w:szCs w:val="20"/></w:rPr>';
}
function wPara(text, bold){
  const rp=rPrArial(bold);
  return '<w:p><w:pPr>'+rp+'</w:pPr><w:r>'+rp+'<w:t xml:space="preserve">'+xmlMulti(text)+'</w:t></w:r></w:p>';
}
// costruisce i paragrafi della sezione "INTERVENTION REPORT" dai giorni della app
function buildReportXML(r){
  const days=r.days.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  if(!days.length) return wPara('—',false);
  let out='';
  days.forEach((d,idx)=>{
    out+=wPara(`${fmtDateShort(d.date)}${d.type==='viaggio'?' (viaggio)':''}   [${fmtH(dayHours(d))}]`, true);
    if(commuteTxt(d)) out+=wPara(commuteTxt(d), false);
    out+=wPara(d.notes||'—', false);
    // foto ordinate in tabella invisibile a 2 colonne, con didascalia sotto ciascuna
    const imgs=[];
    (d.photos||[]).forEach(p=>{ if(p._img) imgs.push({rId:p._img.rId, cx:p._img.cx, cy:p._img.cy, docId:p._img.docId, caption:p.caption||''}); });
    out+=photoGrid(imgs);
    out+='<w:p/>'; // separatore + paragrafo dopo l'eventuale tabella (richiesto da OOXML)
  });
  return out;
}
// immagine "DAVANTI AL TESTO" (floating), posizione assoluta, Word NON la sposta (allowOverlap=1)
function anchorImg(rId, cx, cy, docId, offX, offY){
  return '<w:drawing>'
   +'<wp:anchor distT="0" distB="0" distL="114300" distR="114300" simplePos="0" relativeHeight="'+docId+'" behindDoc="0" locked="0" layoutInCell="1" allowOverlap="1">'
   +'<wp:simplePos x="0" y="0"/>'
   +'<wp:positionH relativeFrom="column"><wp:posOffset>'+offX+'</wp:posOffset></wp:positionH>'
   +'<wp:positionV relativeFrom="paragraph"><wp:posOffset>'+offY+'</wp:posOffset></wp:positionV>'
   +'<wp:extent cx="'+cx+'" cy="'+cy+'"/>'
   +'<wp:effectExtent l="0" t="0" r="0" b="0"/>'
   +'<wp:wrapNone/>'
   +'<wp:docPr id="'+docId+'" name="Foto '+docId+'"/>'
   +'<wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr>'
   +'<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">'
   +'<a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">'
   +'<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">'
   +'<pic:nvPicPr><pic:cNvPr id="'+docId+'" name="Foto '+docId+'"/><pic:cNvPicPr/></pic:nvPicPr>'
   +'<pic:blipFill><a:blip r:embed="'+rId+'"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>'
   +'<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="'+cx+'" cy="'+cy+'"/></a:xfrm>'
   +'<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>'
   +'</pic:pic></a:graphicData></a:graphic></wp:anchor></w:drawing>';
}
// blocco foto "davanti al testo": griglia 2 colonne a coordinate fisse, dentro i margini, spazio riservato
function photoGrid(imgs){
  if(!imgs.length) return '';
  const TW=6120130, ROW=1620000, BASE=110000, GAP=90000; // area testo ~17cm; riga ~4,5cm; stacco dal testo; distanza tra foto ~0,25cm
  let runs='';
  imgs.forEach((im,k)=>{
    const c=k%2, rr=Math.floor(k/2);
    // col sx al bordo (0); col dx SUBITO dopo la foto di sinistra, ma mai oltre il bordo destro
    const left = c===1 ? imgs[k-1] : null;
    const offX = c===0 ? 0 : Math.min((left?left.cx:2160000)+GAP, Math.max(0, TW - im.cx));
    runs+='<w:r>'+anchorImg(im.rId,im.cx,im.cy,im.docId,offX,BASE+rr*ROW)+'</w:r>';
  });
  let out='<w:p>'+runs+'</w:p>';
  const rows=Math.ceil(imgs.length/2), resTw=Math.round((BASE+rows*ROW)/635); // riserva verticale (twips; 1 twip=635 EMU)
  // spazio riservato con RIGHE VUOTE NORMALI (12pt ciascuna): premendo Invio si va a capo normalmente
  const nLines=Math.ceil(resTw/240);
  for(let i=0;i<nLines;i++) out+='<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="240" w:lineRule="exact"/>'+rPrArial(false)+'</w:pPr></w:p>';
  imgs.forEach(im=>{ if(im.caption) out+=wPara(im.caption, false); });
  return out;
}
// ricava byte + dimensioni + estensione di una foto (assetId o dataUrl)
async function photoBytes(p){
  try{
    let blob;
    if(p.assetId){ const resp=await fetch(assetURL(p.assetId)); blob=await resp.blob(); }
    else if(p.dataUrl){ blob=dataURLtoBlob(p.dataUrl); }
    else return null;
    const buf=await blob.arrayBuffer();
    let w=0,h=0;
    try{ const bmp=await createImageBitmap(blob); w=bmp.width; h=bmp.height; if(bmp.close) bmp.close(); }catch(e){}
    const ct=blob.type||'image/jpeg';
    let ext='jpeg';
    if(/png/.test(ct)) ext='png'; else if(/gif/.test(ct)) ext='gif'; else if(/webp/.test(ct)) ext='webp';
    return {buf, w, h, ext, ct};
  }catch(e){ return null; }
}
// aggiunge le immagini al pacchetto .docx (media + relazioni + content-types) e annota p._img
async function embedPhotos(zip, days){
  const photos=[]; days.forEach(d=>(d.photos||[]).forEach(p=>{ delete p._img; photos.push(p); }));
  if(!photos.length) return;
  const relPath='word/_rels/document.xml.rels';
  let rels=await zip.file(relPath).async('string');
  let maxId=0; (rels.match(/Id="rId(\d+)"/g)||[]).forEach(m=>{ const n=+m.replace(/\D/g,''); if(n>maxId) maxId=n; });
  const ctPath='[Content_Types].xml';
  let ct=await zip.file(ctPath).async('string');
  const haveExt=new Set((ct.match(/Default Extension="([^"]+)"/g)||[]).map(m=>m.replace(/.*Extension="([^"]+)".*/,'$1')));
  const EMU=9525, BOXW=2160000, BOXH=1440000; // riquadro ~6x4 cm (1 cm = 360000 EMU)
  let relAdd='', ctAdd='', docId=1000, idx=0;
  for(const p of photos){
    const info=await photoBytes(p);
    if(!info) continue;
    idx++; const rId='rId'+(++maxId);
    const fname='media/app_img_'+idx+'.'+info.ext;
    zip.file('word/'+fname, info.buf);
    relAdd+='<Relationship Id="'+rId+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="'+fname+'"/>';
    if(!haveExt.has(info.ext)){ haveExt.add(info.ext); ctAdd+='<Default Extension="'+info.ext+'" ContentType="'+info.ct+'"/>'; }
    // adatta l'immagine dentro il riquadro 6x4 cm mantenendo le proporzioni
    let cx=(info.w||800)*EMU, cy=(info.h||600)*EMU;
    const s=Math.min(BOXW/cx, BOXH/cy); cx=Math.round(cx*s); cy=Math.round(cy*s);
    p._img={rId, cx, cy, docId:++docId};
  }
  if(relAdd) zip.file(relPath, rels.replace('</Relationships>', relAdd+'</Relationships>'));
  if(ctAdd) zip.file(ctPath, ct.replace('</Types>', ctAdd+'</Types>'));
}

  try{
    const out=await sjson(prompt,{modelTier:'default'});
    const map={}; ((out&&out.giornate)||[]).forEach(g=>{ if(g&&g.id&&typeof g.testo==='string'&&g.testo.trim()) map[g.id]=g.testo.trim(); });
    const rw=Object.assign({},r,{
      days:(r.days||[]).map(d=> map[d.id]? Object.assign({},d,{notes:map[d.id]}) : d),
      conclusion:(concl && out && typeof out.conclusione==='string' && out.conclusione.trim())? out.conclusione.trim() : r.conclusion
    });
    return { rw, done:true };
  }catch(e){ return { rw:r, done:false }; }
}
// "Type of intervention": sceglie le voci più adatte (Claude, con ripiego a regola fissa)
const INT_TYPES=['New format','Machine installation','Machine start up','Commissioning','Diagnostic Visit','Upgrade','Other','Overhaul'];
function intTypeFallback(r){
  const t=(r.type||'').toLowerCase();
  if(t.includes('start')||t.includes('collaudo')) return {voci:['Machine start up','Commissioning'], altro:'', upgrade:''};
  if(t.includes('riparaz')||t.includes('manutenz')) return {voci:['Other'], altro:'Repair / Maintenance', upgrade:''};
  if(t.includes('garanzia')) return {voci:['Other'], altro:'Warranty', upgrade:''};
  if(t.includes('assistenza')) return {voci:['Diagnostic Visit'], altro:'', upgrade:''};
  return {voci:[], altro:'', upgrade:''};
}
async function classifyIntervention(r){
  const fb=intTypeFallback(r);
  if(!CAP.sample) return fb;
  const note=(r.days||[]).map(d=>d.notes||'').filter(x=>x.trim()).join('\n').slice(0,6000);
  const prompt=`Sei un tecnico field service di macchine etichettatrici ACMI Labelling. Nel modulo "Report interventi" devi spuntare le caselle "Type of intervention" più opportune.
Caselle disponibili (usa ESATTAMENTE questi nomi): ${INT_TYPES.join(', ')}.
Criteri: installazione di macchina nuova → "Machine installation" e "Commissioning"; avviamento/collaudo → "Machine start up" e/o "Commissioning"; nuovo formato/cambio formato → "New format"; diagnosi/sopralluogo/assistenza → "Diagnostic Visit"; aggiornamento software/hardware → "Upgrade" (con breve descrizione in inglese); revisione generale della macchina → "Overhaul"; manutenzione/riparazione → "Other" con descrizione "Repair / Maintenance"; garanzia → "Other" con "Warranty". Spunta solo ciò che è davvero pertinente (di solito 1-2 voci).
Tipo intervento indicato dal tecnico: "${r.type||''}".
Note delle giornate:
${note}
Rispondi SOLO con JSON: {"voci":["..."],"altro":"testo per Other (inglese, breve) o vuoto","upgrade":"testo per Upgrade (inglese, breve) o vuoto"}`;
  try{
    const out=await sjson(prompt,{modelTier:'quick'});
    const voci=((out&&out.voci)||[]).filter(v=>INT_TYPES.includes(v));
    if(!voci.length) return fb;
    return {voci, altro:(out.altro||'').toString().trim().slice(0,40), upgrade:(out.upgrade||'').toString().trim().slice(0,40)};
  }catch(e){ return fb; }
}
// ricostruisce le 3 celle della riga caselle con caselle Word vere (cliccabili), stesse voci del modulo
function applyInterventionType(xml, sel){
  const a=xml.indexOf('Type of intervention'); if(a<0) return xml;
  const st=xml.indexOf('<w:tr', xml.indexOf('</w:tr>', a)); const en=xml.indexOf('</w:tr>', st);
  if(st<0||en<0) return xml;
  let row=xml.slice(st,en);
  const cells=row.split('<w:tc>'); if(cells.length!==4) return xml;
  const rp='<w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/><w:b/><w:bCs/><w:sz w:val="18"/><w:szCs w:val="18"/></w:rPr>';
  const box=(on)=>'<w:sdt><w:sdtPr><w14:checkbox><w14:checked w14:val="'+(on?1:0)+'"/><w14:checkedState w14:val="2612" w14:font="MS Gothic"/><w14:uncheckedState w14:val="2610" w14:font="MS Gothic"/></w14:checkbox></w:sdtPr><w:sdtContent><w:r><w:rPr><w:rFonts w:ascii="MS Gothic" w:eastAsia="MS Gothic" w:hAnsi="MS Gothic" w:hint="eastAsia"/><w:sz w:val="20"/><w:szCs w:val="20"/></w:rPr><w:t>'+(on?'☒':'☐')+'</w:t></w:r></w:sdtContent></w:sdt>';
  const line=(label,extra)=>{ const on=sel.voci.includes(label);
    return '<w:p><w:pPr><w:spacing w:before="40" w:after="40"/><w:ind w:left="200"/></w:pPr>'+box(on)
      +'<w:r>'+rp+'<w:t xml:space="preserve"> '+xmlEsc(label)+(extra!==undefined?': ':'')+'</w:t></w:r>'
      +(extra!==undefined?'<w:r>'+rp.replace('<w:b/><w:bCs/>','')+'<w:t xml:space="preserve">'+(extra?xmlEsc(extra):'_______________')+'</w:t></w:r>':'')
      +'</w:p>'; };
  const groups=[
    line('New format')+line('Machine installation'),
    line('Machine start up')+line('Commissioning')+line('Diagnostic Visit'),
    line('Upgrade', sel.voci.includes('Upgrade')?sel.upgrade:'')+line('Other', sel.voci.includes('Other')?sel.altro:'')+line('Overhaul')
  ];
  for(let i=1;i<=3;i++){
    const c=cells[i]; const pe=c.indexOf('</w:tcPr>'); const ce=c.lastIndexOf('</w:tc>');
    if(pe<0||ce<0) return xml;
    cells[i]=c.slice(0,pe+9)+groups[i-1]+c.slice(ce);
  }
  row=cells.join('<w:tc>');
  return xml.slice(0,st)+row+xml.slice(en);
}
async function downloadWord(r, btn){
  if(typeof JSZip==='undefined'){ toast('Componente Word non pronto, riprova tra un attimo'); return; }
  const prev = btn? btn.innerHTML : '';
  if(btn){ btn.disabled=true; btn.innerHTML='Preparo il Word…'; }
  try{
    const t=reportTotals(r);
    const days=r.days.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    if(btn) btn.innerHTML='Rileggo e correggo i testi…';
    const pro=await professionalize(r);
    if(!pro.done) toast('Testi non riformulati: uso quelli originali');
    const intSel=await classifyIntervention(r);
    if(btn) btn.innerHTML='Preparo il Word…';
    const firstDate=days.length?fmtDateShort(days[0].date):'';
    const fields={
      CUSTOMER:r.customer||'',
      TECHNICIAN:r.technician||'',
      SERIAL:r.serial||'',
      MACHINE:r.machine||'',
      ACTIVITY:r.type||'',
      CONTACT:r.customerContact||'',
      FSE:'',
      FSERESP:r.fseResp||'',
      WORKINGHOURS:`Lavoro ${fmtH(t.work)} · Viaggio ${fmtH(t.travel)} · Giornate ${t.days}`,
      FDLDATE:(r.fdl?r.fdl+' · ':'')+firstDate,
      CONCLUSION:pro.rw.conclusion||''
    };
    // carica lo stampo ufficiale ACMI incorporato nella pagina (base64)
    const el=document.getElementById('tmplDocx');
    const b64=el? el.textContent.replace(/\s+/g,'') : '';
    if(!b64) throw new Error('stampo non incorporato');
    const bin=atob(b64); const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const zip=await JSZip.loadAsync(bytes);
    // incorpora le foto come immagini reali (media + relazioni + content-types)
    await embedPhotos(zip, days);
    let xml=await zip.file('word/document.xml').async('string');
    // riempie i segnaposto di testo
    Object.keys(fields).forEach(k=>{
      const val = (k==='CONCLUSION') ? xmlMulti(fields[k]) : xmlEsc(fields[k]);
      xml=xml.split('{{'+k+'}}').join(val);
    });
    // RIMUOVE il riquadro: sostituisce l'INTERA tabella (cella unica) che contiene
    // {{REPORT}} con il contenuto come testo libero a piena larghezza, che scorre tra le pagine.
    const mp=xml.indexOf('{{REPORT}}');
    if(mp>=0){
      const ts=xml.lastIndexOf('<w:tbl>', mp);
      const teRaw=xml.indexOf('</w:tbl>', mp);
      if(ts>=0 && teRaw>ts){
        const te=teRaw+'</w:tbl>'.length;
        xml = xml.slice(0,ts) + buildReportXML(pro.rw) + xml.slice(te);
      } else {
        // fallback: sostituisce solo il paragrafo del segnaposto
        xml=xml.replace(/<w:p\b[^>]*>(?:(?!<\/w:p>)[\s\S])*?\{\{REPORT\}\}(?:(?!<\/w:p>)[\s\S])*?<\/w:p>/, buildReportXML(pro.rw));
      }
    }
    // caselle "Type of intervention" scelte in base al tipo di intervento
    try{ xml=applyInterventionType(xml, intSel); }catch(_){}
    // blocco "TRAINING SUGGESTIONS" → "INTERVENTION CONCLUSION" sempre unito: inizia su pagina nuova
    const tp=xml.indexOf('TRAINING SUGGESTIONS');
    if(tp>=0){
      const pp=xml.lastIndexOf('<w:pPr>', tp);
      const ps=Math.max(xml.lastIndexOf('<w:p ', tp), xml.lastIndexOf('<w:p>', tp));
      if(pp>ps && ps>=0) xml=xml.slice(0,pp+7)+'<w:pageBreakBefore/>'+xml.slice(pp+7);
    }
    zip.file('word/document.xml', xml);
    const blob=await zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document', compression:'DEFLATE'});
    const safe=(r.customer||'cantiere').replace(/[\\/:*?"<>|]+/g,' ').trim().slice(0,60)||'cantiere';
    const filename='Report '+safe+'.docx';
    const browserSave=()=>{
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download=filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
    };
    if(CAP.downloads && CAP.downloads.save){
      try{
        await CAP.downloads.save({filename, data:blob});
        toast('File Word pronto');
      }catch(e){
        if(e && e.code==='declined'){ /* annullato dall'utente: non ripiegare */ }
        else { browserSave(); toast('File Word scaricato'); } // ripiego: download del browser
      }
    }else{
      browserSave();
      toast('File Word scaricato');
    }
  }catch(err){
    const code=err && err.code;
    if(code==='declined'){ /* annullato dall'utente */ }
    else toast('Errore Word: '+((err&&err.message)||code||'imprevisto'));
  }finally{
    (r.days||[]).forEach(d=>(d.photos||[]).forEach(p=>{ delete p._img; }));
    if(btn){ btn.disabled=false; btn.innerHTML=prev; }
  }
}

function busy(msg){ const t=document.getElementById('toast'); clearTimeout(t._t);
  if(msg){ t.textContent=msg; t.classList.add('show','busy'); } else t.classList.remove('show','busy'); }
// legge il .docx in ordine: paragrafi, righe di tabella (celle separate da " | ") e immagini
async function docxRead(file){
  const zip=await JSZip.loadAsync(await file.arrayBuffer());
  const names=Object.keys(zip.files).filter(n=>/^word\/(header\d*|document|footer\d*)\.xml$/.test(n))
    .sort((a,b)=>(a.includes('document')?1:0)-(b.includes('document')?1:0));
  const items=[];
  const runText=el=>{ let s=''; const walk=n=>{ for(const c of n.childNodes){ const ln=c.localName;
      if(ln==='t') s+=c.textContent; else if(ln==='tab') s+='\t'; else if(ln==='br'||ln==='cr') s+='\n';
      else if(c.childNodes&&c.childNodes.length) walk(c); } }; walk(el); return s.replace(/[ \t]+\n/g,'\n').trim(); };
  const blips=el=>{ const out=[]; const walk=n=>{ for(const c of n.childNodes){ if(c.localName==='blip'){ const id=c.getAttribute('r:embed')||[...c.attributes].find(a=>a.localName==='embed')?.value; if(id) out.push(id); } else if(c.childNodes&&c.childNodes.length) walk(c); } }; walk(el); return out; };
  for(const n of names){
    const xml=new DOMParser().parseFromString(await zip.file(n).async('string'),'application/xml');
    let rels={}; const rf=zip.file(n.replace('word/','word/_rels/')+'.rels');
    if(rf){ const rx=new DOMParser().parseFromString(await rf.async('string'),'application/xml');
      [...rx.getElementsByTagName('Relationship')].forEach(r=>rels[r.getAttribute('Id')]=r.getAttribute('Target')); }
    const isDoc=n.includes('document');
    const block=nd=>{ for(const c of nd.childNodes){ const ln=c.localName;
        if(ln==='p'){ const t=runText(c); if(t) items.push({k:'p',text:t});
          if(isDoc) blips(c).forEach(id=>{ const tg=rels[id]; if(tg&&!/^https?:/.test(tg)) items.push({k:'img',path:'word/'+tg.replace(/^\.?\//,'')}); }); }
        else if(ln==='tbl'){ for(const tr of c.childNodes){ if(tr.localName!=='tr') continue;
            const tcs=[...tr.childNodes].filter(x=>x.localName==='tc');
            const nP=tcs.reduce((n,tc)=>n+[...tc.getElementsByTagNameNS('*','p')].filter(p=>runText(p)).length,0);
            if(isDoc && (nP>4 || tcs.some(tc=>blips(tc).length))){ tcs.forEach(tc=>block(tc)); continue; }
            const cells=[...tr.childNodes].filter(x=>x.localName==='tc').map(tc=>[...tc.childNodes].filter(p=>p.localName==='p').map(runText).filter(Boolean).join(' / '));
            const line=cells.filter((x,i)=>x&&x!==cells[i-1]).join(' | '); if(line) items.push({k:'row',text:line}); } }
        else if(c.childNodes&&c.childNodes.length&&ln!=='rPr'&&ln!=='pPr') block(c); } };
    block(xml.documentElement);
  }
  return { zip, items, text:items.filter(i=>i.k!=='img').map(i=>i.text).join('\n') };
}

function labelOf(s){ const low=String(s).toLowerCase().trim();
  for(const [k,w] of WORD_LABELS){ if(low.startsWith(w)){ const nx=low.charAt(w.length); if(!nx||/[\s:.\/]/.test(nx)) return {k, rest:String(s).trim().slice(w.length)}; } }
