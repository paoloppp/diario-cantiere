const cleanVal=v=>String(v||'').replace(/^[\s:.\/|·-]+/,'').replace(/[\s\/|]+$/,'').trim();
function wordHeader(items){
  const res={};
  const put=(k,v)=>{ v=cleanVal(v); if(!v||k==='_skip'||res[k]||v.length>150||labelOf(v)) return;
    if(k==='fdl') v=v.split('·')[0].trim();
    if(k==='fdl' && /^\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}$/.test(v)) return; // solo la data, nessun numero FDL
    if(k==='type'){ const low=v.toLowerCase(); const t=TYPES.find(x=>x.toLowerCase()===low)||typeFromText(low); if(!t) return; v=t; }
    res[k]=v; };
  for(const it of items){ if(it.k==='img') continue;
    if(/^(intervention report|descrizione attivit)/i.test(it.text)) break;   // da qui in poi è il diario delle giornate
    const cells=it.text.split(/\s*\|\s*|\t+/);
    cells.forEach((c,i)=>{ const L=labelOf(c); if(!L) return;
      const own=cleanVal(L.rest);
      if(own) put(L.k,own); else if(cells[i+1]!==undefined && !labelOf(cells[i+1])) put(L.k,cells[i+1]); });
  }
  return res;
}
function typeFromText(low){
  if(/garanzia|warranty/.test(low)) return 'In garanzia';
  if(/riparazion|manutenzion|repair|maintenance/.test(low)) return 'Riparazione / Manutenzione';
  if(/start.?up|collaudo|avviamento|commissioning/.test(low)) return 'Start-up / Collaudo';
  if(/assistenza|diagnos/.test(low)) return 'Assistenza';
  return '';
}
// giornate: riga con la data (es. "28/10/2026 (viaggio) [10h30]"), poi il testo, poi le foto con le didascalie
const DAY_RE=/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})\b\s*(\((viaggio|travel|lavoro)\))?\s*(\[\s*(\d+(?:[.,]\d+)?)\s*h\s*(\d{1,2})?\s*\])?\s*[:\-–]?\s*([\s\S]*)$/i;
const RANGE_RE=/^(\d{1,2})\s*[-–]\s*(\d{1,2})[\/.](\d{1,2})[\/.](\d{2}|\d{4})\b\s*[:\-–]?\s*([\s\S]*)$/;
const END_RE=/^(training suggestions|intervention cons?l?usion|conclusion|conclusione|only for softwarists)/i;
// sezioni di chiusura scritte nel report: finiscono nella conclusione, non nell'ultima giornata
const TAIL_RE=/^(problematiche|problemi riscontrati|criticit|formati provati|riepilogo|osservazioni|note finali|considerazioni|a disposizione per)/i;
function wordDays(items){
  const days=[]; let cur=null, started=false, tail=null;
  days.tail=[];
  const hasMarker=items.some(i=>/^(intervention report|descrizione attivit)/i.test(i.text||''));
  for(const it of items){
    if(!started){ if(!hasMarker||/^(intervention report|descrizione attivit)/i.test(it.text||'')){ started=true; if(hasMarker) continue; } else continue; }
    if(it.k==='img'){ if(cur) cur.imgs.push(it.path); continue; }
    if(it.k==='row' && !cur) continue;
    const t=it.text.trim();
    if(END_RE.test(t)) break;
    if(tail){ days.tail.push(t); continue; }
    if(cur && TAIL_RE.test(t)){ tail=true; days.tail.push(t); continue; }
    const rg=t.length<400 && t.match(RANGE_RE);
    if(rg){ let y=rg[4]; if(y.length===2) y='20'+y; const mo=+rg[3], d1=+rg[1], d2=+rg[2];
      if(mo>=1&&mo<=12&&d1>=1&&d2<=31&&d2>=d1){
        const iso=dd=>`${y}-${String(mo).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
        // "29/10" seguito da "29-30/10": la prima riga vuota è la stessa giornata
        if(cur&&cur.date===iso(d1)&&!cur.notes.length&&!cur.imgs.length) days.pop();
        cur={ date:iso(d1), type:'lavoro', hours:null, notes:[], caps:[], imgs:[], until:iso(d2) };
        if(rg[5]&&rg[5].trim()) cur.notes.push(rg[5].trim());
        days.push(cur); continue; } }
    const m=t.length<400 && t.match(DAY_RE);
    if(m){ let y=m[3]; if(y.length===2) y='20'+y;
      const mo=+m[2], da=+m[1];
      if(mo>=1&&mo<=12&&da>=1&&da<=31){
        cur={ date:`${y}-${String(mo).padStart(2,'0')}-${String(da).padStart(2,'0')}`,
          type:/viaggio|travel/i.test(m[5]||'')?'viaggio':'lavoro',
          hours: m[7]!=null? num(m[7])+(m[8]?(+m[8])/60:0) : null, notes:[], caps:[], imgs:[] };
        if(m[9]&&m[9].trim()) cur.notes.push(m[9].trim());
        days.push(cur); continue; } }
    if(!cur || t==='—' || t==='-') continue;
    // dopo le foto: frase breve = didascalia (come nei report dell'app), testo lungo = continua il lavoro del giorno
    if(cur.imgs.length && t.length<=80 && cur.caps.length<cur.imgs.length) cur.caps.push(t); else cur.notes.push(t);
  }
  return days;
}
function wordConclusion(items){
  for(const it of items){ const m=(it.text||'').match(/intervention cons?l?usion\s*:?\s*([\s\S]*)$|^conclusione\s*:?\s*([\s\S]+)$/i);
    if(m){ const v=cleanVal(m[1]||m[2]||'').replace(/\s*\|\s*intervention cons?l?usion\s*:?/ig,'').trim(); if(v) return v; } }
  return '';
}
async function photoFromZip(zip,path){
  const f=zip.file(path); if(!f) return null;
  const ext=(path.split('.').pop()||'').toLowerCase();
  if(!/^(jpe?g|png|gif|webp|bmp)$/.test(ext)) return null;
  let blob=new Blob([await f.async('arraybuffer')],{type:ext==='png'?'image/png':'image/'+(ext==='jpg'?'jpeg':ext)});
  try{ blob=await downscale(blob); }catch(e){}
  if(CAP.assets){ try{ const res=await CAP.assets.upload(blob,{type:blob.type||'image/jpeg'}); urlCache[res.id]=res.url; return {assetId:res.id,caption:''}; }catch(e){} }
  return { dataUrl:await blobToDataURL(blob), caption:'' };
}
const HM=v=>/^\d{1,2}:\d{2}$/.test(String(v||''))?String(v).padStart(5,'0'):'';
async function wordAI(text){
  const prompt=`Sei l'assistente di un tecnico che installa macchine etichettatrici. Qui sotto c'è il testo di un documento Word (rapportino/report d'intervento, ordine o richiesta d'intervento).
Estrai i dati per ricreare il cantiere COMPLETO. Usa SOLO informazioni presenti nel testo; se un dato manca metti "".
Rispondi SOLO con JSON:
{"customer":"","machine":"","serial":"","matricola":"","address":"città, paese","type":"uno tra: Start-up / Collaudo | Riparazione / Manutenzione | In garanzia | Assistenza","technician":"","fdl":"","customerContact":"","fseResp":"","conclusion":"",
"days":[{"date":"YYYY-MM-DD","type":"lavoro o viaggio","hours":numero ore totali o null,"amStart":"HH:MM","amEnd":"HH:MM","pmStart":"HH:MM","pmEnd":"HH:MM","fromPlace":"","toPlace":"","notes":"lavoro svolto quel giorno, testo completo e identico all'originale"}]}

TESTO DEL DOCUMENTO:
"""
${text.slice(0,30000)}
"""`;
  return await sjson(prompt);
}

    const r={ id:uid(), customer:pick('customer'), machine:pick('machine'), serial:pick('serial'), matricola:pick('matricola'),
      address:pick('address'), type:TYPES.includes(ty)?ty:(typeFromText(doc.text.toLowerCase())||'Start-up / Collaudo'),
      technician:pick('technician')||'Mottola Paolo', fdl:pick('fdl'), customerContact:pick('customerContact'), fseResp:pick('fseResp'),
      conclusion:wordConclusion(doc.items)||pick('conclusion'), createdAt:new Date().toISOString(), days:[], sourceFile:f.name };
    if(!r.customer) r.customer=f.name.replace(/\.docx$/i,'');
    const mkDay=(date,type,hours,notes)=>{ const via=type==='viaggio', hk=hours!=null&&!isNaN(hours);
      return { id:uid(), date, type:via?'viaggio':'lavoro',
        amStart:hk||via?'':'08:00', amEnd:hk||via?'':'13:00', pmStart:hk||via?'':'13:30', pmEnd:hk||via?'':'18:00',
        workHours:(!via&&hk)?String(Math.round(hours*100)/100):'', travelHours:(via&&hk)?String(Math.round(hours*100)/100):'',
        fromPlace:'', toPlace:'', notes:notes||'', photos:[] }; };
    let nPh=0;
    if(pd.length){
      for(let i=0;i<pd.length;i++){ const x=pd[i];
        const d=mkDay(x.date,x.type,x.hours,x.notes.join('\n'));
        for(let j=0;j<x.imgs.length;j++){ busy(`Recupero le foto… (${nPh+1})`);
          const p=await photoFromZip(doc.zip,x.imgs[j]); if(p){ p.caption=x.caps[j]||''; d.photos.push(p); nPh++; } }
        r.days.push(d);
        if(x.until){ let dt=new Date(x.date+'T12:00:00Z'); const end=new Date(x.until+'T12:00:00Z');
          const lab=fmtDateShort(x.date);
          for(dt.setUTCDate(dt.getUTCDate()+1); dt<=end; dt.setUTCDate(dt.getUTCDate()+1))
            r.days.push(mkDay(dt.toISOString().slice(0,10),'lavoro',x.hours,'Prosecuzione delle attività del '+lab+'.')); } }
      if(!r.conclusion && pd.tail && pd.tail.length) r.conclusion=pd.tail.join('\n');
    } else if(ai&&Array.isArray(ai.days)){
      ai.days.forEach(x=>{ if(!x||!/^\d{4}-\d{2}-\d{2}$/.test(x.date||'')) return;
        const hrs=(x.hours!=null&&x.hours!=='')?num(x.hours,NaN):null;
        const d=mkDay(x.date,x.type==='viaggio'?'viaggio':'lavoro',isNaN(hrs)?null:hrs,String(x.notes||''));
        if(hrs==null&&d.type==='lavoro'){ d.amStart=HM(x.amStart)||'08:00'; d.amEnd=HM(x.amEnd)||'13:00'; d.pmStart=HM(x.pmStart)||'13:30'; d.pmEnd=HM(x.pmEnd)||'18:00'; }
        d.fromPlace=x.fromPlace||''; d.toPlace=x.toPlace||''; r.days.push(d); });
    }
    busy();
    WS.reports.push(r); scheduleSave();
    go('report',{reportId:r.id});
    toast(r.days.length? `Cantiere creato: ${r.days.length} giornate${nPh?', '+nPh+' foto':''} — controlla` : 'Cantiere creato (giornate non trovate) — controlla i dati');
  };
  inp.click();
}

/* ---------- FDL Excel (modulo Omnia Labelling): ore viaggio e lavoro giornata per giornata ---------- */
const FDL_ROWS={ out:[16,25], work:[26,35], ret:[36,46] };
const FDL_FILE='MOTTOLA_PERNOD_INDIA_FDL_OMNIA_Labelling_ENG.xlsx';
function hm2d(t){ if(t==null||t==='') return null; const [h,m]=String(t).split(':').map(Number); if(isNaN(h)) return null; return ((h||0)*60+(m||0))/1440; }
function iso2serial(iso){ return Math.round((Date.UTC(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10))-Date.UTC(1899,11,30))/86400000); }
function isoAdd(iso,n){ const d=new Date(iso+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
// righe FDL di un viaggio: orari nel fuso di PARTENZA, spezzati a mezzanotte (così la formula del modulo torna)
function fdlTravelRows(d){
  if(d.checkIn && d.checkOut){
    const span=travelSpan(d); if(span==null||span<=0) return [];
    // fuso orario: orari come vissuti (partenza in ora locale di partenza, arrivo in ora locale di arrivo);
    // la differenza di fuso viene tolta dal totale e segnata in piccolo (es. "+4,5")
    const sh=Number(d.tzShift||0);
    let start=hm2d(d.checkIn)*24, date=d.date, left=span-sh; const rows=[];
    while(left>0.0001 && rows.length<4){
      const seg=Math.min(left, 24-start);
      const end=(start+seg)/24;   // mezzanotte: scrivo 23:59 (+1 min nella formula) invece di un 0:00 che confonde
      rows.push(end>=0.99999? {date, a:start/24, b:1439/1440, extra:1/1440} : {date, a:start/24, b:end, extra:0});
      left-=seg; start=0; date=isoAdd(date,1);
    }
    if(sh && rows.length){
      const len=x=>((x.b-x.a)+(x.extra||0))*24;
      const x=len(rows[rows.length-1])>=Math.abs(sh)?rows[rows.length-1]:rows[0];
      x.extra=(x.extra||0)+sh/24; x.note=(sh<0?'+':'−')+String(Math.abs(sh)).replace('.',',');
    }
    return rows;
  }
  const h=Number(d.travelHours)||0;   // viaggio scritto solo come totale ore
  return h? [{date:d.date, a:null, b:null, extra:h/24}] : [];
}
function fdlWorkRow(d){
  const lunch=d.lunch?(Number(d.lunchMin)||60)/1440:0;
  if(d.checkIn){ if(!d.checkOut) return null;
    return {date:d.date, a:hm2d(d.checkIn), b:hm2d(d.checkOut), c:null, e:null, extra:-lunch}; }
  if(d.workHours!=null&&String(d.workHours).trim()!=='')
    return {date:d.date, a:null,b:null,c:null,e:null, extra:num(d.workHours,0)/24};
  return {date:d.date, a:hm2d(d.amStart), b:hm2d(d.amEnd), c:hm2d(d.pmStart), e:hm2d(d.pmEnd), extra:0};
}
function fdlPlan(r){
  const days=(r.days||[]).filter(d=>d.date).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||((a.checkIn||'').localeCompare(b.checkIn||'')));
  const work=days.filter(d=>d.type!=='viaggio');
  const firstWork=work.length?work[0].date:null;
  const out=[],ret=[],wk=[];
  days.forEach(d=>{
    if(d.type==='viaggio'){ (firstWork && d.date>firstWork ? ret : out).push(...fdlTravelRows(d)); }
    else { const w=fdlWorkRow(d);
      // trasferimento hotel ↔ cantiere: l'orario di inizio è la partenza dall'hotel e quello di fine l'arrivo in hotel.
      // Andata = inizio → inizio+durata, ritorno = fine−durata → fine; il lavoro dal cliente sta in mezzo.
      const co=parseDur(d.commuteOut)/24, cb=parseDur(d.commuteBack)/24;
      // giornata con check-in/out e pausa: la divido in mattina e pomeriggio (pausa dalla fine mattina, di default 13:00)
      if(w && d.checkIn && d.lunch && w.a!=null && w.b!=null && w.c==null){
        const L=hm2d(d.amEnd)!=null?hm2d(d.amEnd):13/24, Ld=(Number(d.lunchMin)||60)/1440;
        if(w.a+co < L && L+Ld < w.b-cb){ w.c=L+Ld; w.e=w.b; w.b=L; w.extra=0; } }
      if(w && co){ if(w.a!=null){ out.push({date:d.date, a:w.a, b:w.a+co, extra:0}); w.a+=co; }
                   else { out.push({date:d.date, a:null, b:null, extra:co}); w.extra-=co; } }
      if(w && cb){ const k=w.e!=null?'e':(w.b!=null?'b':null);
                   if(k){ ret.push({date:d.date, a:w[k]-cb, b:w[k], extra:0}); w[k]-=cb; }
                   else { ret.push({date:d.date, a:null, b:null, extra:cb}); w.extra-=cb; } }
      if(w) wk.push(w); }
  });
  return {out,ret,wk};
}
function xlSetCell(xml, ref, inner, tAttr){
  const re=new RegExp('<c r="'+ref+'"([^>]*?)(?:/>|>[\\s\\S]*?</c>)');
  return xml.replace(re,(m,attrs)=>{
    const s=(attrs.match(/\ss="\d+"/)||[''])[0];
    return inner==null ? `<c r="${ref}"${s}/>` : `<c r="${ref}"${s}${tAttr?' t="'+tAttr+'"':''}>${inner}</c>`;
  });
}
const xlNum=v=>'<v>'+String(Number.isInteger(v)?v:Math.round(v*1440)/1440)+'</v>';  // minuti esatti, piena precisione
const xlStr=s=>'<is><t xml:space="preserve">'+xmlEsc(s)+'</t></is>';
async function downloadFdl(r, btn){
  if(typeof JSZip==='undefined'){ toast('Componente Excel non pronto: riprova con la rete'); return; }
  const prev=btn?btn.innerHTML:''; if(btn){ btn.disabled=true; btn.innerHTML='Preparo l’FDL…'; }
  try{
    const el=document.getElementById('tmplFdl'); const b64=el?el.textContent.replace(/\s+/g,''):'';
    if(!b64) throw new Error('modulo FDL non incorporato');
    const bin=atob(b64), bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const zip=await JSZip.loadAsync(bytes);
    let xml=await zip.file('xl/worksheets/sheet1.xml').async('string');
    const P=fdlPlan(r), warn=[];
    let totW=0,totT=0;
    const fill=(rows,[r0,r1],totCol,label)=>{
      if(rows.length>r1-r0+1) warn.push(label+': '+rows.length+' righe, il modulo ne ha '+(r1-r0+1));
      for(let n=r0;n<=r1;n++){
        const x=rows[n-r0];
        const put=(col,v)=>{ xml=xlSetCell(xml,col+n, v==null?null:xlNum(v)); };
        put('C',x?iso2serial(x.date):null);
        put('D',x?x.a:null); put('E',x?x.b:null); put('F',x?x.c:null); put('G',x?x.e:null);
        if(x&&x.note) xml=xlSetCell(xml,'F'+n,'<is><r><rPr><sz val="7"/><color rgb="FF666666"/></rPr><t>'+x.note+'</t></r></is>','inlineStr');
        let tot=0;
        if(x){ tot=((x.b??0)-(x.a??0)); if(x.b!=null&&x.a!=null&&tot<0) tot+=1; tot+=((x.e??0)-(x.c??0))+(x.extra||0); }
        const ex=x&&x.extra?(x.extra>0?'+':'')+(Math.round(x.extra*1440))+'/1440':'';
        xml=xlSetCell(xml,totCol+n,(x&&x.note?`<f>(E${n}-D${n})${ex}</f>`:`<f>(E${n}-D${n})+(G${n}-F${n})${ex}</f>`)+xlNum(tot));
        if(totCol==='H') totW+=tot; else totT+=tot;
      }
    };
    fill(P.out,FDL_ROWS.out,'I','Viaggio andata');
    fill(P.wk,FDL_ROWS.work,'H','Lavoro');
    fill(P.ret,FDL_ROWS.ret,'I','Viaggio ritorno');
    xml=xlSetCell(xml,'I47','<f>SUM(H26:H35)</f>'+xlNum(totW));
    xml=xlSetCell(xml,'I48','<f>SUM(I16:I25,I36:I46)</f>'+xlNum(totT));
    // intestazione: il modulo è già compilato per Pernod; per altri clienti uso i dati del cantiere
    if(!/pernod/i.test(r.customer||'')){
      if(r.customer) xml=xlSetCell(xml,'B9',xlStr('Name of the Company :  '+r.customer),'inlineStr');
      xml=xlSetCell(xml,'D11',r.address?xlStr(r.address):null,r.address?'inlineStr':null);
      xml=xlSetCell(xml,'D13',r.machine?xlStr(r.machine):null,r.machine?'inlineStr':null);
      xml=xlSetCell(xml,'N13',r.serial?xlStr(r.serial):null,r.serial?'inlineStr':null);
      xml=xlSetCell(xml,'L3',xlStr('Intervention report Nr: '+(r.fdl||'')),'inlineStr');
      if(r.technician) xml=xlSetCell(xml,'L4',xlStr(String(r.technician).toUpperCase()),'inlineStr');
    }
    zip.file('xl/worksheets/sheet1.xml',xml);
    zip.remove('xl/calcChain.xml');
    let ct=await zip.file('[Content_Types].xml').async('string');
    zip.file('[Content_Types].xml', ct.replace(/<Override[^>]*calcChain[^>]*\/>/,''));
    let rel=await zip.file('xl/_rels/workbook.xml.rels').async('string');
    zip.file('xl/_rels/workbook.xml.rels', rel.replace(/<Relationship[^>]*calcChain[^>]*\/>/,''));
    let wb=await zip.file('xl/workbook.xml').async('string');
    wb=/<calcPr[^>]*fullCalcOnLoad/.test(wb)?wb:wb.replace(/<calcPr\b/,'<calcPr fullCalcOnLoad="1"');
    zip.file('xl/workbook.xml',wb);
    const blob=await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',compression:'DEFLATE'});
    const safe=(r.customer||'cantiere').replace(/[\\/:*?"<>|]+/g,' ').trim().slice(0,40);
    const filename=/pernod/i.test(r.customer||'')?FDL_FILE:('MOTTOLA_'+safe.replace(/\s+/g,'_').toUpperCase()+'_FDL_OMNIA_Labelling_ENG.xlsx');
    const ok=await saveBlobFile(filename, blob);
    if(ok) toast(warn.length?('FDL pronto · ⚠ '+warn.join(' · ')):'FDL pronto');
  }catch(err){ toast('Errore FDL: '+((err&&err.message)||'imprevisto')); }
  finally{ if(btn){ btn.disabled=false; btn.innerHTML=prev; } }
}

// render iniziale (prima che le capability rispondano) per non mostrare pagina vuota
loadWorkspace().then(()=>{ render(); boot(); });

})();
